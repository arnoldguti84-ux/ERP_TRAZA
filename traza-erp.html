/* ===================== VIDA DE COMPONENTES ===================== */
function findLastComponentChange(plate, component){
  let best = null;
  state.maintenance.filter(m=>m.kind==='Correctivo' && m.plate===plate && m.component===component && m.kmDone!=null).forEach(m=>{
    const km = Number(m.kmDone);
    if(!best || km>best.km) best = {km, date: m.date};
  });
  state.workOrderItems.filter(i=>i.component===component && i.status==='Terminado').forEach(i=>{
    const ot = state.workOrders.find(o=>o.id===i.workOrderId);
    if(!ot || ot.plate!==plate || ot.km==null) return;
    const km = Number(ot.km);
    if(!best || km>best.km) best = {km, date: ot.startDatetime? String(ot.startDatetime).slice(0,10) : null};
  });
  return best;
}
function getProjectedKmFor(plate, component){
  const override = state.componentLifeOverrides.find(o=>o.plate===plate && o.component===component);
  if(override) return {projectedKm: override.projectedKm, isOverride:true};
  const cfg = state.componentLifeConfig.find(c=>c.component===component);
  return cfg? {projectedKm: cfg.projectedKm, isOverride:false} : {projectedKm:null, isOverride:false};
}
function computeComponentLifeRows(){
  const configs = state.componentLifeConfig;
  if(configs.length===0) return [];
  const vehicles = state.vehicles.filter(v=>v.status!=='Fuera de Servicio');
  const rows = [];
  vehicles.forEach(v=>{
    configs.forEach(cfg=>{
      const {projectedKm, isOverride} = getProjectedKmFor(v.plate, cfg.component);
      const last = findLastComponentChange(v.plate, cfg.component);
      const currentKm = v.km!=null? Number(v.km) : null;
      const kmSinceLast = currentKm!=null? (last? currentKm-last.km : currentKm) : null;
      const kmRemaining = (kmSinceLast!=null && projectedKm!=null)? projectedKm-kmSinceLast : null;
      rows.push({
        plate: v.plate, brand: v.brand||'', model: v.model||'', brandModel: `${v.brand||''} ${v.model||''}`.trim()||'—',
        component: cfg.component, projectedKm, isOverride, currentKm,
        lastChangeDisplay: last? `${fmtDate(last.date)} / ${last.km.toLocaleString('es-PE')} km` : 'Sin historial',
        kmSinceLast, kmRemaining,
        urgent: kmRemaining!=null && kmRemaining<=1500
      });
    });
  });
  return rows;
}

async function saveDriverForm(d, driver){
  if(!d.name){ alert('Indica el nombre completo.'); return false; }
  let vehiclePlate = null;
  if(d.plate && d.plate.trim()){
    const matched = normalizeAndValidatePlate(d.plate);
    if(!matched) return false;
    if(matched!==driver?.vehiclePlate){
      const count = state.drivers.filter(x=>x.vehiclePlate===matched && x.id!==(driver?driver.id:null)).length;
      if(count>=2){ alert('Ese vehículo ya tiene 2 conductores asignados (el máximo permitido).'); return false; }
    }
    vehiclePlate = matched;
  }
  const payload = { name:d.name.trim(), license:d.license||'—', licenseExpiry:d.licenseExpiry||null, status:d.status||'Activo', phone:d.phone||'—', vehiclePlate };
  let record;
  if(driver){
    if(driver.vehiclePlate && driver.vehiclePlate!==payload.vehiclePlate){ await unassignDriverFromVehicle(driver.vehiclePlate, driver.id); }
    record = await dbUpdate('drivers', driver.id, payload);
    if(record) Object.assign(driver, record);
  } else {
    record = await dbInsert('drivers', payload);
    if(record) state.drivers.unshift(record);
  }
  if(!record) return false;
  if(payload.vehiclePlate){ await assignDriverToVehicle(payload.vehiclePlate, record.id); }
  return true;
}
async function assignDriverToVehicle(plate, driverId){
  const v = findVehicle(plate);
  if(!v) return;
  if(v.driverId===driverId || v.driverId2===driverId) return;
  if(!v.driverId){ v.driverId = driverId; await dbUpdate('vehicles', v.id, {driverId}); }
  else if(!v.driverId2){ v.driverId2 = driverId; await dbUpdate('vehicles', v.id, {driverId2:driverId}); }
}
async function unassignDriverFromVehicle(plate, driverId){
  const v = findVehicle(plate);
  if(!v) return;
  if(v.driverId===driverId){ v.driverId = null; await dbUpdate('vehicles', v.id, {driverId:null}); }
  else if(v.driverId2===driverId){ v.driverId2 = null; await dbUpdate('vehicles', v.id, {driverId2:null}); }
}

async function handleDriverImportFile(file){
  const raw = await readExcelRows(file);
  if(!raw) return;
  const norm = (h)=> normalizeHeader(h);
  const map = {};
  raw.forEach(()=>{});
  const rows = []; let skipped=0;
  raw.forEach(r=>{
    const mapped = {};
    Object.keys(r).forEach(h=>{
      const nh = norm(h);
      if(nh.includes('apellidos') || nh==='nombre' || nh.includes('nombres')) mapped.name = r[h];
      else if(nh.includes('licencia') && !nh.includes('vigencia')) mapped.license = r[h];
      else if(nh.includes('vigencia')) mapped.licenseExpiry = r[h];
      else if(nh.includes('telefono')) mapped.phone = r[h];
      else if(nh.includes('estado')) mapped.status = r[h];
      else if(nh.includes('vehiculo') || nh==='placa') mapped.plate = r[h];
    });
    const name = (mapped.name||'').toString().trim();
    if(!name){ skipped++; return; }
    const row = { name };
    if(mapped.license) row.license = String(mapped.license).trim();
    if(mapped.licenseExpiry){ const parsed = parseExcelDate(mapped.licenseExpiry); if(parsed) row.licenseExpiry = parsed; }
    if(mapped.phone) row.phone = String(mapped.phone).trim();
    row.status = DRIVER_STATUS_OPTIONS.includes(mapped.status) ? mapped.status : 'Activo';
    if(mapped.plate) row.vehiclePlate = String(mapped.plate).trim().toUpperCase();
    rows.push(row);
  });
  if(rows.length===0){ alert('Ninguna fila tenía Nombre completo — no se importó nada.'); return; }
  const existingByName = new Map(state.drivers.map(d=>[d.name.trim().toUpperCase(), d]));
  const willUpdate = rows.filter(r=>existingByName.has(r.name.toUpperCase())).length;
  const willCreate = rows.length - willUpdate;
  const proceed = confirm(`Se leyeron ${rows.length} fila(s) con nombre` + (skipped?` (${skipped} sin nombre se omitieron)`:'') + `.\n\n${willCreate} conductor(es) nuevo(s) se crearán.\n${willUpdate} conductor(es) ya existente(s) (mismo nombre) se actualizarán.\n\n¿Continuar?`);
  if(!proceed) return;
  let createdCount=0, updatedCount=0; const failures=[];
  for(const row of rows){
    const existing = existingByName.get(row.name.toUpperCase());
    try{
      if(existing){
        const {data, error} = await sb.from('drivers').update(toSnake(normalizeUppercaseAccents(row))).eq('id', existing.id).select().single();
        if(error) throw error;
        Object.assign(existing, toCamel(data));
        updatedCount++;
      } else {
        const payload = {license:'—', phone:'—', ...row};
        const {data, error} = await sb.from('drivers').insert(toSnake(normalizeUppercaseAccents(payload))).select().single();
        if(error) throw error;
        state.drivers.unshift(toCamel(data));
        createdCount++;
      }
    } catch(err){
      failures.push(`${row.name}: ${(err && err.message) || err}`);
    }
  }
  renderView();
  let msg = `Importación completa.\n\nCreados: ${createdCount}\nActualizados: ${updatedCount}`;
  if(failures.length){
    msg += `\nFallaron: ${failures.length}\n\nMotivo (primeras ${Math.min(15,failures.length)}):\n` + failures.slice(0,15).join('\n') + (failures.length>15? `\n... y ${failures.length-15} más.`:'');
  }
  alert(msg);
}

const ATTENDANCE_STATUSES = ['Trabajado','Descanso','Falta','Descanso Medico','Suspension','Licencia','Vacaciones','Delegado'];
function attendanceStatusBadge(status){
  const map = {'Trabajado':'badge-ok','Descanso':'badge-idle','Falta':'badge-crit','Descanso Medico':'badge-warn','Suspension':'badge-crit','Licencia':'badge-accent','Vacaciones':'badge-accent','Delegado':'badge-idle'};

function computeDriverMonthSummary(driverId, monthStr){
  const records = state.driverAttendance.filter(a=>a.driverId===driverId && String(a.date).slice(0,7)===monthStr);
  const counts = {}; ATTENDANCE_STATUSES.forEach(s=>counts[s]=0);
  let totalKm = 0, totalTrips = 0, totalRoutePay = 0, montoServicio = 0, montoViatico = 0;
  let horasTrabajadas = 0;
  const SERVICE_BONUS = {'ORO':12,'PLATA':8,'BRONCE':4,'CLASICO':4,'CLÁSICO':4};
  records.forEach(r=>{
    counts[r.status] = (counts[r.status]||0) + 1;
    if(r.status==='Trabajado'){
      montoViatico += 15;
      if(r.plate){
        const vehicle = findVehicle(r.plate);
        const service = vehicle && vehicle.service? vehicle.service.trim().toUpperCase() : '';
        montoServicio += SERVICE_BONUS[service] || 0;
      }
    }
    [r.routeTrip1, r.routeTrip2].forEach(routeName=>{
      if(!routeName) return;
      const rr = state.routeRates.find(x=>x.routeName===routeName);
      if(rr){ totalKm += Number(rr.km)||0; totalRoutePay += Number(rr.payPerTrip)||0; totalTrips++; horasTrabajadas += Number(rr.hours)||0; }
    });
  });
  const montoTotal = totalRoutePay + montoServicio + montoViatico;
  const cfg = state.driverPayrollConfig.find(c=>c.driverId===driverId) || {baseSalary:0,familyAllowance:0,fuelBonus:0,serviceBonus:0,viaticoBonus:0};
  const grossSalary = Number(cfg.baseSalary||0) + Number(cfg.familyAllowance||0) + Number(cfg.fuelBonus||0) + Number(cfg.serviceBonus||0) + Number(cfg.viaticoBonus||0) + totalRoutePay;
  return { records, counts, totalKm, totalTrips, totalRoutePay, montoServicio, montoViatico, montoTotal, cfg, grossSalary, horasTrabajadas };
}

async function saveAttendance(d, existingId){
  const drv = normalizeAndValidateDriverName(d.driverName);
  if(drv===null) return false;
  if(!drv.id){ alert('Selecciona un conductor.'); return false; }
  if(!d.date){ alert('Indica la fecha.'); return false; }
  const payload = {
    driverId: drv.id, date: d.date, status: d.status||'Trabajado',
    plate: d.status==='Trabajado' && d.plate? d.plate.trim().toUpperCase() : null,
    routeTrip1: d.status==='Trabajado' && d.routeTrip1? d.routeTrip1 : null,
    routeTrip2: d.status==='Trabajado' && d.routeTrip2? d.routeTrip2 : null
  };
  let record;
  if(existingId){
    record = await dbUpdate('driver_attendance', existingId, payload);
    if(record){ const idx = state.driverAttendance.findIndex(x=>x.id===existingId); if(idx!==-1) state.driverAttendance[idx]=record; }
  } else {
    const existing = state.driverAttendance.find(a=>a.driverId===payload.driverId && String(a.date).slice(0,10)===payload.date);
    if(existing){
      record = await dbUpdate('driver_attendance', existing.id, payload);
      if(record) Object.assign(existing, record);
    } else {
      record = await dbInsert('driver_attendance', payload);
      if(record) state.driverAttendance.push(record);
    }
  }
  return !!record;
}

async function saveRouteTrip(d, existingId){
  if(!d.plate){ alert('Indica la placa.'); return false; }
  const plate = normalizeAndValidatePlate(d.plate); if(!plate) return false;
  const drv = normalizeAndValidateDriverName(d.driverName); if(drv===null) return false;
  const coDrv = normalizeAndValidateDriverName(d.coDriverName); if(coDrv===null) return false;
  const payload = { plate, date: d.date||todayLocal(), routeName: d.routeName||null, driverId: drv.id, coDriverId: coDrv.id };
  let record;
  if(existingId){ record = await dbUpdate('routes', existingId, payload); if(record){ const idx=state.routes.findIndex(x=>x.id===existingId); if(idx!==-1) state.routes[idx]=record; } }
  else { record = await dbInsert('routes', payload); if(record) state.routes.push(record); }
  if(!record) return false;
  for(const drvId of [payload.driverId, payload.coDriverId]){
    if(!drvId) continue;
    const existingAtt = state.driverAttendance.find(a=>a.driverId===drvId && String(a.date).slice(0,10)===payload.date);
    if(existingAtt){
      const patch = existingAtt.routeTrip1 && existingAtt.routeTrip1!==payload.routeName? {routeTrip2:payload.routeName, status:'Trabajado', plate:payload.plate} : {routeTrip1:payload.routeName, status:'Trabajado', plate:payload.plate};
      const updated = await dbUpdate('driver_attendance', existingAtt.id, patch);
      if(updated) Object.assign(existingAtt, updated);
    } else {
      const created = await dbInsert('driver_attendance', {driverId:drvId, date:payload.date, status:'Trabajado', plate:payload.plate, routeTrip1:payload.routeName});
      if(created) state.driverAttendance.push(created);
    }
  }
  return true;
}
function computeAttendanceGaps(driverIds, minDateStr, maxDateStr){
  const [y1,m1,d1] = minDateStr.split('-').map(Number);
  const [y2,m2,d2] = maxDateStr.split('-').map(Number);
  let cur = new Date(y1,m1-1,d1);
  const end = new Date(y2,m2-1,d2);
  const dates = [];
  while(cur<=end){ dates.push(localDateStr(cur)); cur.setDate(cur.getDate()+1); }
  const gaps = [];
  driverIds.forEach(driverId=>{
    dates.forEach(dateStr=>{
      const exists = state.driverAttendance.some(a=>a.driverId===driverId && String(a.date).slice(0,10)===dateStr);
      if(!exists) gaps.push({driverId, date:dateStr});
    });
  });
  return gaps;
}

async function handleRouteImportFile(file){
  const raw = await readExcelRows(file);
  if(!raw) return;
  const rows = []; let skipped = 0; const unknownDrivers = new Set();
  raw.forEach(r=>{
    const mapped = {};
    Object.keys(r).forEach(h=>{
      const nh = normalizeHeader(h);
      if(nh.includes('fecha')) mapped.date = r[h];
      else if(nh==='placa') mapped.plate = r[h];
      else if(nh.includes('ruta')) mapped.routeName = r[h];
      else if(nh.includes('copiloto')) mapped.coDriverName = r[h];
      else if(nh.includes('piloto')) mapped.driverName = r[h];
    });
    const plate = (mapped.plate||'').toString().trim().toUpperCase();
    const dateParsed = mapped.date? parseExcelDate(mapped.date) : null;
    if(!plate || !dateParsed){ skipped++; return; }
    if(!findVehicle(plate)){ skipped++; return; }
    let driverId=null, coDriverId=null;
    if(mapped.driverName){
      const dr = state.drivers.find(x=>x.name.trim().toUpperCase()===String(mapped.driverName).trim().toUpperCase());
      if(dr) driverId = dr.id; else unknownDrivers.add(String(mapped.driverName).trim());
    }
    if(mapped.coDriverName){
      const dr = state.drivers.find(x=>x.name.trim().toUpperCase()===String(mapped.coDriverName).trim().toUpperCase());
      if(dr) coDriverId = dr.id; else unknownDrivers.add(String(mapped.coDriverName).trim());
    }
    rows.push({ plate, date: dateParsed, routeName: mapped.routeName? String(mapped.routeName).trim().toUpperCase() : null, driverId, coDriverId });
  });
  if(rows.length===0){ alert('Ninguna fila tenía Fecha y Placa válidas (con vehículo existente) — no se importó nada.'); return; }
  let msg = `Se leyeron ${rows.length} viaje(s) válido(s)` + (skipped?` (${skipped} fila(s) se omitieron por falta de fecha/placa o placa no encontrada)`:'') + '.';
  if(unknownDrivers.size) msg += `\n\nOjo: estos nombres de piloto/copiloto no coinciden con ningún conductor registrado y se dejarán en blanco: ${[...unknownDrivers].join(', ')}`;
  msg += '\n\n¿Continuar con la importación?';
  if(!confirm(msg)) return;
  const created = [];
  for(const row of rows){
    const rec = await dbInsert('routes', row);
    if(rec){ state.routes.push(rec); created.push(rec); }
  }
  const touchedDriverIds = new Set();
  for(const rec of created){
    for(const drvId of [rec.driverId, rec.coDriverId]){
      if(!drvId) continue;
      touchedDriverIds.add(drvId);
      const dateStr = String(rec.date).slice(0,10);
      const existingAtt = state.driverAttendance.find(a=>a.driverId===drvId && String(a.date).slice(0,10)===dateStr);
      if(existingAtt){
        const patch = existingAtt.routeTrip1 && existingAtt.routeTrip1!==rec.routeName? {routeTrip2:rec.routeName, status:'Trabajado', plate:rec.plate} : (existingAtt.routeTrip1? {} : {routeTrip1:rec.routeName, status:'Trabajado', plate:rec.plate});
        if(Object.keys(patch).length){ const updated = await dbUpdate('driver_attendance', existingAtt.id, patch); if(updated) Object.assign(existingAtt, updated); }
      } else {
        const createdAtt = await dbInsert('driver_attendance', {driverId:drvId, date:dateStr, status:'Trabajado', plate:rec.plate, routeTrip1:rec.routeName});
        if(createdAtt) state.driverAttendance.push(createdAtt);
      }
    }
  }
  let gapsFound = 0;
  if(touchedDriverIds.size && created.length){
    const allDates = created.map(r=>String(r.date).slice(0,10));
    const minDate = allDates.reduce((a,b)=> a<b?a:b);
    const maxDate = allDates.reduce((a,b)=> a>b?a:b);
    const gaps = computeAttendanceGaps([...touchedDriverIds], minDate, maxDate);
    gapsFound = gaps.length;
    if(gaps.length){ filters.rutasGaps = gaps; filters.rutasView = 'gaps'; }
  }
  renderView();
  alert(`Importación completa. Se crearon ${created.length} viaje(s) y se actualizó la asistencia de ${touchedDriverIds.size} conductor(es).` + (gapsFound? `\n\nHay ${gapsFound} día(s) vacío(s) por completar — te llevamos a esa pantalla.` : ''));
}
function renderRutasGaps(){
  document.getElementById('topbar-actions').innerHTML = `<button class="btn" id="btn-gaps-back">← Volver a Viajes</button>`;
  document.getElementById('btn-gaps-back').addEventListener('click', ()=>{ filters.rutasView='lista'; filters.rutasGaps=null; renderView(); });
  const gaps = filters.rutasGaps || [];
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>Días vacíos por completar</h3><div class="hint">Estos conductores no tienen ningún viaje ni estado registrado en estos días del rango importado — indica qué pasó cada día</div></div>
      <div class="form-row">
        <div><label>Aplicar el mismo estado a todos</label><select id="gaps-bulk-status"><option value="">—</option>${TRIP_STATUSES_FOR_GAPS.map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div style="display:flex;align-items:end;"><button class="btn" id="btn-gaps-apply-bulk" style="margin-bottom:12px;">Aplicar a todos</button></div>
      </div>
      <div class="table-scroll"><table><thead><tr><th>Conductor</th><th>Fecha</th><th>Estado</th></tr></thead>
      <tbody>${gaps.map((g,i)=>{ const drv=findDriver(g.driverId); return `<tr>
        <td>${drv?drv.name:'—'}</td><td>${fmtDate(g.date)}</td>
        <td><select class="gap-status-select" data-gap-index="${i}"><option value="">Sin definir</option>${TRIP_STATUSES_FOR_GAPS.map(s=>`<option>${s}</option>`).join('')}</select></td>
      </tr>`; }).join('') || `<tr><td colspan="3"><div class="empty">Sin días vacíos</div></td></tr>`}</tbody></table></div>
      ${gaps.length? `<button class="btn btn-primary" id="btn-gaps-save" style="margin-top:14px;">Guardar todos</button>` : ''}
    </div>
  `;
  const bulkBtn = document.getElementById('btn-gaps-apply-bulk');
  if(bulkBtn) bulkBtn.addEventListener('click', ()=>{
    const val = document.getElementById('gaps-bulk-status').value;
    if(!val) return;
    document.querySelectorAll('.gap-status-select').forEach(sel=>{ sel.value = val; });
  });
  const saveBtn = document.getElementById('btn-gaps-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const selects = document.querySelectorAll('.gap-status-select');
    const toSave = [];
    selects.forEach(sel=>{ const idx = Number(sel.dataset.gapIndex); if(sel.value) toSave.push({ ...gaps[idx], status: sel.value }); });
    if(toSave.length===0){ alert('No seleccionaste ningún estado.'); return; }
    for(const g of toSave){
      const created = await dbInsert('driver_attendance', { driverId:g.driverId, date:g.date, status:g.status });
      if(created) state.driverAttendance.push(created);
    }
    filters.rutasGaps = gaps.filter(g=> !toSave.some(t=>t.driverId===g.driverId && t.date===g.date));
    if(filters.rutasGaps.length===0){ filters.rutasView='lista'; filters.rutasGaps=null; }
    renderView();
    alert(`Se guardaron ${toSave.length} día(s).`);
  });
}
function renderRutas(){
  if(filters.rutasView==='gaps'){ renderRutasGaps(); return; }
  document.getElementById('topbar-actions').innerHTML = canWrite()? `
    <button class="btn" id="btn-route-template">Plantilla</button>
    <button class="btn" id="btn-route-import">Importar viajes</button>
    <button class="btn" id="btn-route-export">Exportar</button>
    <input type="file" id="route-import-file" accept=".xlsx,.xls" style="display:none;">
    <button class="btn btn-primary" id="btn-add-route">+ Registrar viaje</button>` : '';
  if(canWrite()){
    document.getElementById('btn-route-template').addEventListener('click', downloadRouteTemplate);
    document.getElementById('btn-route-import').addEventListener('click', ()=> document.getElementById('route-import-file').click());
    document.getElementById('route-import-file').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(f) handleRouteImportFile(f); e.target.value=''; });
    document.getElementById('btn-add-route').addEventListener('click', ()=>{
      openModal('Registrar viaje', routeFormBody(), async (d)=>{
        const ok = await saveRouteTrip(d);
        if(ok){ closeModal(); renderView(); }
      }, 'Registrar');
    });
  }
  const sorted = [...state.routes].sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(document.getElementById('btn-route-export')) document.getElementById('btn-route-export').addEventListener('click', ()=> exportRoutesExcel(sorted));
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Placa</th><th>Ruta</th><th>Piloto</th><th>Copiloto</th>${canWrite()?'<th></th>':''}</tr></thead>
      <tbody>${sorted.map(r=>{ const drv=r.driverId?findDriver(r.driverId):null; const co=r.coDriverId?findDriver(r.coDriverId):null; return `<tr>
        <td>${fmtDate(r.date)}</td><td class="mono">${r.plate}</td><td>${r.routeName||'—'}</td><td>${drv?drv.name:'—'}</td><td>${co?co.name:'—'}</td>
        ${canWrite()?`<td><button class="btn btn-sm" data-route-edit="${r.id}">Editar</button> <button class="btn btn-sm btn-danger" data-route-del="${r.id}">Eliminar</button></td>`:''}
      </tr>`; }).join('') || `<tr><td colspan="${canWrite()?6:5}"><div class="empty">Sin viajes registrados</div></td></tr>`}</tbody></table></div>
    </div>`;
  if(canWrite()){
    document.querySelectorAll('[data-route-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const rt = state.routes.find(x=>x.id===btn.dataset.routeEdit);
        openModal('Editar viaje', routeFormBody(rt), async (d)=>{
          const ok = await saveRouteTrip(d, rt.id);
          if(ok){ closeModal(); renderView(); }
        }, 'Guardar cambios');
      });
    });
    document.querySelectorAll('[data-route-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('¿Eliminar este viaje? Esto no borra la asistencia ya generada.')) return;
        const {error} = await sb.from('routes').delete().eq('id', btn.dataset.routeDel);
        if(error){ alert('No se pudo eliminar: '+error.message); return; }
        state.routes = state.routes.filter(x=>x.id!==btn.dataset.routeDel);
        renderView();
      });
    });
  }
}

// Mapea el campo Operación del vehículo a la plantilla que le corresponde.
// Turístico y Local caen en Pasajeros por default ya que también
// transportan personas.
const CHECKLIST_OPERATION_TEMPLATE = { 'INTERPROVINCIAL':'pasajeros', 'TURISTICO':'pasajeros', 'LOCAL':'pasajeros', 'CARGA':'carga', 'PERSONAL':'mina' };
function checklistTemplateIdForVehicle(vehicle){
  const op = vehicle && vehicle.operation? vehicle.operation.trim().toUpperCase() : '';
  return CHECKLIST_OPERATION_TEMPLATE[op] || 'pasajeros';
}
function checklistTemplateIdForCode(code){
  return Object.keys(CHECKLIST_TEMPLATES).find(id=>CHECKLIST_TEMPLATES[id].code===code) || 'pasajeros';
}
function checklistFlatItems(templateId){
  return CHECKLIST_TEMPLATES[templateId].sections.flatMap(s=>s.items.map(it=>({...it, section:s.title, result:'C'})));
}
function checklistStatusFor(items){
  // Si la plantilla marca ítems críticos (*), solo un NC en uno de esos
  // rechaza la unidad — un NC en un ítem no crítico queda como observación.
  // Si la plantilla no distingue críticos (Pasajeros/Carga), cualquier NC
  // rechaza, igual que en esos formatos en papel.
  const hasCritical = items.some(i=>i.critical);
  const relevant = hasCritical? items.filter(i=>i.critical) : items;
  return relevant.some(i=>i.result==='NC')? 'Rechazado' : 'Aprobado';
}
function checklistStatusBadgeClass(status){
  return status==='Aprobado'? 'badge-ok' : 'badge-crit';
}
function checklistDefaultKm(plate){
  const last = getLastKmEntries(plate,1)[0];
  if(last) return last.km;
  const vehicle = findVehicle(plate);
  return vehicle && vehicle.km!=null? vehicle.km : '';
}
// Genera una Orden de Trabajo formal (con N° de OT) a partir de los
// hallazgos de una inspección Rechazada — reusa el mismo formulario y flujo
// de guardado que "+ Nueva OT" en Mantenimiento.
function generarOtDeChecklist(c){
  const fails = (c.items||[]).filter(i=>i.result==='NC').map(i=>`${i.code} ${i.item}`);
  const driver = c.header && c.header.driver1? state.drivers.find(d=>d.name===c.header.driver1) : null;
  const basePrefill = {
    plate: c.plate,
    km: c.header && c.header.kmInicial!=null && c.header.kmInicial!==''? c.header.kmInicial : null,
    driverId: driver? driver.id : null,
    place: (c.header && (c.header.route||c.header.zone)) || null,
    observations: `HALLAZGOS NO CONFORMES EN INSPECCIÓN ${c.code||''} (${fmtDate(c.date)}): ${fails.join(', ')}`
  };
  function openNewOtModalFromChecklist(prefill){
    openModal(`Nueva Orden de Trabajo — N° ${computeNextOtNumber()}`, otHeaderFormBody(prefill), async (d)=>{
      const payload = otHeaderPayloadFromForm(d, computeNextOtNumber()); if(!payload) return;
      if(!await checkOtHeaderKmAnomaly(payload)){ openNewOtModalFromChecklist(Object.assign({},prefill,payload)); return; }
      const created = await dbInsert('work_orders', payload);
      if(created){
        state.workOrders.unshift(created);
        if(payload.place) await ensureCatalogValue('ciudad', payload.place);
        await logOtHeaderKm(payload);
        closeModal();
        state.view = 'mantenimiento'; filters.maintSubTab = 'ot'; filters.otDetailId = created.id;
        renderApp();
      }
    }, 'Crear OT');
    wireOtHeaderAutoKm();
  }
  openNewOtModalFromChecklist(basePrefill);
}
// Misma idea que generarOtDeChecklist, para un reporte de falla enviado por
// un Conductor desde su celular (ver renderConductorApp). El reporte queda
// marcado "Convertido a OT" y vinculado a la OT creada.
function generarOtDeFalla(report){
  const driver = report.driverId? state.drivers.find(d=>d.id===report.driverId) : null;
  const basePrefill = {
    plate: report.plate,
    km: report.km!=null? report.km : null,
    driverId: driver? driver.id : null,
    place: report.place || null,
    observations: `REPORTE DE FALLA DE ${report.driverName||'piloto'} (${fmtDateTime(report.createdAt)}):\n${faultReportIssuesSummary(report)}`
  };
  function openNewOtModalFromFalla(prefill){
    openModal(`Nueva Orden de Trabajo — N° ${computeNextOtNumber()}`, otHeaderFormBody(prefill), async (d)=>{
      const payload = otHeaderPayloadFromForm(d, computeNextOtNumber()); if(!payload) return;
      if(!await checkOtHeaderKmAnomaly(payload)){ openNewOtModalFromFalla(Object.assign({},prefill,payload)); return; }
      const created = await dbInsert('work_orders', payload);
      if(created){
        state.workOrders.unshift(created);
        if(payload.place) await ensureCatalogValue('ciudad', payload.place);
        await logOtHeaderKm(payload);
        const updatedReport = await dbUpdate('fault_reports', report.id, {status:'Convertido a OT', workOrderId: created.id});
        if(updatedReport) Object.assign(report, updatedReport);
        closeModal();
        state.view = 'mantenimiento'; filters.maintSubTab = 'ot'; filters.otDetailId = created.id;
        renderApp();
      }
    }, 'Crear OT');
    wireOtHeaderAutoKm();
  }
  openNewOtModalFromFalla(basePrefill);
}

  const map = {'Pendiente':'badge-warn','Convertido a OT':'badge-ok','Descartado':'badge-idle'};

        if(f.source==='route') return `<div><label>${f.label}</label><input data-header-key="${f.key}" type="text" list="chk-route-list" value="${val}" autocomplete="off"></div>`;
        return `<div><label>${f.label}</label><input data-header-key="${f.key}" type="${f.type||'text'}" value="${val}"></div>`;
      }).join('')}

    <datalist id="chk-driver-list">${state.drivers.map(d=>`<option value="${d.name}">`).join('')}</datalist>
    <datalist id="chk-route-list">${[...state.routeRates].sort((a,b)=>a.routeName.localeCompare(b.routeName,'es')).map(r=>`<option value="${r.routeName}">`).join('')}</datalist>
    <div style="margin-top:6px;">${itemsHtml}</div>
    <label style="margin-top:12px;">Observaciones / Hallazgos detectados</label>
    <textarea id="chk-observations" rows="2" placeholder="Opcional">${pendingChecklist.observations||''}</textarea>
    <div class="modal-actions"><button class="btn" id="chk-cancel">Cancelar</button><button class="btn btn-primary" id="chk-submit">Guardar inspección</button></div>
  </div>`;
  document.getElementById('chk-plate').addEventListener('input',(e)=>{
    pendingChecklist.plate=e.target.value;
    const vehicle = findVehicle(e.target.value.trim().toUpperCase());
    const templateId = checklistTemplateIdForVehicle(vehicle);
    if(templateId!==pendingChecklist.templateId){
      pendingChecklist.templateId = templateId;
      pendingChecklist.header = {};
      pendingChecklist.items = checklistFlatItems(templateId);
      if(vehicle) pendingChecklist.header.kmInicial = checklistDefaultKm(vehicle.plate);
      renderChecklistForm();
    } else if(vehicle){
      pendingChecklist.header.kmInicial = checklistDefaultKm(vehicle.plate);
      const kmInput = document.querySelector('[data-header-key="kmInicial"]');
      if(kmInput) kmInput.value = pendingChecklist.header.kmInicial;
    }
  });
  area.querySelectorAll('[data-header-key]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ pendingChecklist.header[inp.dataset.headerKey] = inp.value; });
  });
  document.getElementById('chk-observations').addEventListener('input',(e)=>{ pendingChecklist.observations = e.target.value; });
  area.querySelectorAll('.toggle-btn').forEach(btn=>{ btn.addEventListener('click', ()=>{ pendingChecklist.items[Number(btn.dataset.idx)].result = btn.dataset.val; renderChecklistForm(); }); });
  document.getElementById('chk-cancel').addEventListener('click', ()=>{ pendingChecklist=null; renderChecklistForm(); });
  document.getElementById('chk-submit').addEventListener('click', async ()=>{
    const plate = (pendingChecklist.plate||'').trim().toUpperCase();
    if(!findVehicle(plate)){ alert('Esa placa no existe en Vehículos.'); return; }
    const status = checklistStatusFor(pendingChecklist.items);
    const payload = {
      plate, date: pendingChecklist.date||todayLocal(), items:pendingChecklist.items, status,
      serviceLabel: template.label, code: template.code,
      header: pendingChecklist.header, observations: pendingChecklist.observations||null
    };
    const isEdit = !!pendingChecklist.id;
    const saved = isEdit? await dbUpdate('checklists', pendingChecklist.id, payload) : await dbInsert('checklists', payload);
    if(saved){
      if(isEdit){ const idx = state.checklists.findIndex(x=>x.id===saved.id); if(idx>-1) state.checklists[idx]=saved; }
      else state.checklists.unshift(saved);
      pendingChecklist=null;
      renderChecklist();
      if(status==='Rechazado') alert(`Inspección guardada como ${template.resultLabels.fail}. Esta unidad no debe despacharse hasta corregir los hallazgos — puedes generar el correctivo o la Orden de Trabajo desde el detalle.`);
    }
  });
}

/* ===================== NEUMÁTICOS ===================== */
const TIRE_ESTADOS = ['Bueno','Regular','Cambiar'];
// Ciclo de vida real de un neumático (independiente de su condición física
// -estado-): entra a Almacén, se Monta en una unidad, y al desmontarlo va a
// Almacén (todavía sirve), Reencauche (a reencauchar) o Cementerio (baja).
// Desde Reencauche vuelve a Almacén con la generación +1.
const TIRE_STATUSES = ['Almacen','Montado','Reencauche','Cementerio'];
const TIRE_STATUS_LABEL = {Almacen:'Almacén', Montado:'Montado', Reencauche:'Reencauche', Cementerio:'Cementerio'};
function tireStatusBadge(status){
  const map = {Almacen:'badge-idle', Montado:'badge-ok', Reencauche:'badge-warn', Cementerio:'badge-crit'};
  return `<span class="badge ${map[status]||'badge-idle'}">${TIRE_STATUS_LABEL[status]||status}</span>`;
}
// Fórmula rodante -> ejes de adelante hacia atrás, cada uno simple (2
// posiciones) o doble/rodado gemelo (4 posiciones: Ext/Int por lado). Es
// una aproximación razonable por tipo de configuración, no un dato exacto
// por unidad — si una unidad puntual difiere, se puede seguir cargando
// posiciones libres (P1-P6) igual que antes.
const CHASSIS_AXLE_LAYOUTS = {
  '4X2':   [{dual:false},{dual:true}],                     // eje delantero simple + trasero doble (bus/camión de 2 ejes más común)
  '4X4':   [{dual:false},{dual:false}],                     // 2 ejes simples con tracción integral (camioneta 4x4)
  '6X2':   [{dual:false},{dual:true},{dual:true}],           // delantero simple, 2 ejes traseros dobles (confirmado en flota: T0U-808/T0T-919)
  '6X4':   [{dual:false},{dual:true},{dual:true}],          // delantero simple, 2 ejes traseros dobles (tándem de tracción)
  '8X2':   [{dual:false},{dual:false},{dual:true},{dual:false}], // 2 delanteros simples, tracción doble, eje libre simple
  '6X2X4': [{dual:false},{dual:true},{dual:false}]          // delantero simple, tracción doble, eje direccional trasero simple
};
const GENERIC_TIRE_POSITIONS = ['P1','P2','P3','P4','P5','P6'];
function computeChassisPositions(wheelFormula){
  const axles = CHASSIS_AXLE_LAYOUTS[(wheelFormula||'').toString().trim().toUpperCase()];
  if(!axles) return null;
  const positions = [];
  let n = 0;
  axles.forEach((axle, axleIdx)=>{
    if(axle.dual){
      positions.push({id:`P${++n}`, axle:axleIdx+1, side:'Izq', sub:'Ext', y:axleIdx, x:-70});
      positions.push({id:`P${++n}`, axle:axleIdx+1, side:'Izq', sub:'Int', y:axleIdx, x:-42});
      positions.push({id:`P${++n}`, axle:axleIdx+1, side:'Der', sub:'Int', y:axleIdx, x:42});
      positions.push({id:`P${++n}`, axle:axleIdx+1, side:'Der', sub:'Ext', y:axleIdx, x:70});
    } else {
      positions.push({id:`P${++n}`, axle:axleIdx+1, side:'Izq', sub:null, y:axleIdx, x:-55});
      positions.push({id:`P${++n}`, axle:axleIdx+1, side:'Der', sub:null, y:axleIdx, x:55});
    }
  });
  return positions;
}
function tirePositionDatalistOptions(vehicle){
  const positions = vehicle? computeChassisPositions(vehicle.wheelFormula) : null;
  return positions
    ? positions.map(p=>`<option value="${p.id}">Eje ${p.axle} ${p.side}${p.sub?' '+p.sub:''}</option>`).join('')
    : GENERIC_TIRE_POSITIONS.map(p=>`<option value="${p}">`).join('');
}
function tirePositionHintText(vehicle){
  const positions = vehicle? computeChassisPositions(vehicle.wheelFormula) : null;
  if(positions) return `Configuración detectada: ${vehicle.wheelFormula} · ${positions.length} posiciones`;
  if(vehicle) return `Este vehículo no tiene una fórmula rodante reconocida (${vehicle.wheelFormula||'sin definir'}) — posiciones genéricas P1-P6.`;
  return 'Escribe una placa para ver sus posiciones según su configuración de ejes.';
}

async function saveTireIngreso(d){
  const codes = (d.codes||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(codes.length===0){ alert('Indica al menos un código de neumático.'); return false; }
  const dupInList = codes.find((c,i)=>codes.findIndex(x=>x.toUpperCase()===c.toUpperCase())!==i);
  if(dupInList){ alert(`El código "${dupInList}" está repetido en la lista.`); return false; }
  const existingCodes = new Set(state.tires.filter(t=>t.code).map(t=>t.code.toUpperCase()));
  const already = codes.find(c=>existingCodes.has(c.toUpperCase()));
  if(already){ alert(`El código "${already}" ya existe en el sistema.`); return false; }
  const cost = Number(d.cost);
  if(d.cost!==undefined && d.cost!=='' && (isNaN(cost) || cost<0)){ alert('El costo ingresado es inválido.'); return false; }
  const retreadGen = d.retreadGen!==undefined && d.retreadGen!==''? Number(d.retreadGen) : 0;
  if(isNaN(retreadGen) || retreadGen<0){ alert('La generación de reencauche ingresada es inválida.'); return false; }
  const initialTreadMm = d.initialTreadMm!==undefined && d.initialTreadMm!==''? Number(d.initialTreadMm) : null;
  if(initialTreadMm!=null && (isNaN(initialTreadMm)||initialTreadMm<0)){ alert('La cocada inicial ingresada es inválida.'); return false; }
  const shared = {
    status:'Almacen', installDate: d.installDate||todayLocal(),
    supplier: d.supplier? d.supplier.trim() : null,
    guideNumber: d.guideNumber? d.guideNumber.trim() : null,
    invoiceNumber: d.invoiceNumber? d.invoiceNumber.trim() : null,
    cost: isNaN(cost)?0:cost, brand: d.brand? d.brand.trim() : null,
    size: d.size? d.size.trim() : null, design: d.design? d.design.trim() : null,
    retreadGen: isNaN(retreadGen)?0:retreadGen, initialTreadMm
  };
  let createdCount = 0;
  for(const code of codes){
    const created = await dbInsert('tires', {...shared, code});
    if(!created) continue; // dbInsert ya avisó el error puntual de esa fila
    state.tires.push(created);
    const ev = await dbInsert('tire_events', {tireId:created.id, eventType:'Ingreso', cost: shared.cost, eventDate: shared.installDate});
    if(ev) state.tireEvents.unshift(ev);
    createdCount++;
  }
  if(createdCount) alert(`Se ingresaron ${createdCount} neumático(s) a almacén.`);
  return createdCount>0;
}

  const mountKm = vehicle && vehicle.km!=null? Number(vehicle.km) : 0;
  const updated = await dbUpdate('tires', tire.id, {status:'Montado', plate, position, mountKm, installDate:todayLocal()});
  if(!updated) return false;
  Object.assign(tire, updated);
  const ev = await dbInsert('tire_events', {tireId:tire.id, eventType:'Montaje', plate, position, km:mountKm});
  if(ev) state.tireEvents.unshift(ev);
  return true;

async function dismountTire(tire, destStatus, reason){
  const vehicle = findVehicle(tire.plate);
  const km = vehicle && vehicle.km!=null? Number(vehicle.km) : tire.mountKm;
  const plate = tire.plate, position = tire.position;
  const updated = await dbUpdate('tires', tire.id, {status:destStatus, plate:null, position:null});
  if(!updated) return false;
  Object.assign(tire, updated);
  const ev1 = await dbInsert('tire_events', {tireId:tire.id, eventType:'Desmontaje', plate, position, km, reason});
  if(ev1) state.tireEvents.unshift(ev1);
  if(destStatus==='Reencauche' || destStatus==='Cementerio'){
    const ev2 = await dbInsert('tire_events', {tireId:tire.id, eventType: destStatus==='Reencauche'?'Envio a reencauche':'Baja', reason});
    if(ev2) state.tireEvents.unshift(ev2);
  }
  return true;
}

// Contraparte automática de returnTireFromRetread: se dispara al registrar
// el Comprobante de una OC cuyo ítem de Servicio quedó vinculado a este
// neumático (ver tireId en poItemFormBody/poItemPayloadFromForm). Usa el
// costo REAL con IGV (poItemPenTotal) en vez de uno tipeado a mano. No
// captura cocada inicial (la OC no trae ese dato) — se sigue registrando
// aparte con "Cocada" si hace falta.
async function completeTireRetreadFromPoItem(item, eventDate){
  const tire = state.tires.find(t=>t.id===item.tireId);
  if(!tire) return;
  const cost = poItemPenTotal(item);
  const newGen = (tire.retreadGen||0)+1;
  const updated = await dbUpdate('tires', tire.id, {status:'Almacen', retreadGen:newGen, cost: cost!=null? cost : tire.cost, installDate: eventDate});
  if(updated) Object.assign(tire, updated);
  const ev = await dbInsert('tire_events', {tireId:tire.id, eventType:'Retorno de reencauche', cost, eventDate, sourcePoItemId:item.id});
  if(ev) state.tireEvents.unshift(ev);
}
// Revierte completeTireRetreadFromPoItem si el Comprobante que lo originó
// se elimina — solo si el neumático sigue tal cual quedó (Almacén): si ya
// se volvió a montar, reencauchar o dar de baja después, no se toca (igual
// que el stock de productos no se revierte perfectamente en ese flujo).
async function revertTireRetreadFromPoItem(item){
  const ev = state.tireEvents.find(e=>e.sourcePoItemId===item.id);
  if(!ev) return;
  const tire = state.tires.find(t=>t.id===item.tireId);
  if(tire && tire.status==='Almacen'){
    const newGen = Math.max((tire.retreadGen||1)-1, 0);
    const updated = await dbUpdate('tires', tire.id, {status:'Reencauche', retreadGen:newGen});
    if(updated) Object.assign(tire, updated);
  }
  const {error} = await sb.from('tire_events').delete().eq('id', ev.id);
  if(!error) state.tireEvents = state.tireEvents.filter(x=>x.id!==ev.id);
}
// Cada evento con costo (Ingreso, Retorno de reencauche) es una compra
// real. Se atribuye a una placa solo si el neumático está montado
// actualmente — si está en almacén/reencauche/de baja, cuenta igual en el
// gasto total pero no en el desglose por vehículo.
function tireSpendEvents(){
  return state.tireEvents.filter(e=>e.cost!=null).map(e=>{
    const tire = state.tires.find(t=>t.id===e.tireId);
    const plate = tire && tire.status==='Montado'? tire.plate : null;
    return {plate, date: e.eventDate, cost: Number(e.cost||0)};
  });
}
// Km recorrido de un neumático montado = km actual del vehículo - km que
// tenía el vehículo cuando se montó este neumático (mountKm). No se
// guarda ni se actualiza a mano — se calcula siempre al vuelo, como el
// resto de los cálculos de vida útil de la app (Vida de Componentes,
// Estado de ciclos), para que nunca quede desactualizado.
function tireKmRecorrido(tire){
  const vehicle = findVehicle(tire.plate);
  if(!vehicle || vehicle.km==null || tire.mountKm==null) return null;
  return Number(vehicle.km) - Number(tire.mountKm);
}
function computeTireGapVehicles(){
  return state.vehicles.map(v=>{
    const positions = computeChassisPositions(v.wheelFormula);
    if(!positions) return null;
    const filled = state.tires.filter(t=>t.plate===v.plate && t.status==='Montado').length;
    if(filled>=positions.length) return null;
    return {plate:v.plate, brand:v.brand, model:v.model, formula:v.wheelFormula, expected:positions.length, filled, missing:positions.length-filled};
  }).filter(Boolean);
}

  const byPos = {};
  tiresForPlate.forEach(t=>{ byPos[t.position]=t; });
  const axleCount = Math.max(...positions.map(p=>p.y)) + 1;
  const axleGap = 64, topPad = 30, botPad = 24, marginX = 120, wheelR = 15;
  const height = topPad + (axleCount-1)*axleGap + botPad;
  const colorVar = (estado)=> estado==='Cambiar'? 'var(--crit)' : estado==='Regular'? 'var(--warn)' : 'var(--ok)';
  const railTop = topPad, railBot = topPad + (axleCount-1)*axleGap;
  let svg = `<svg viewBox="0 0 240 ${height}" width="100%" style="max-width:240px;display:block;margin:0 auto;">`;
  svg += `<line x1="${marginX-10}" y1="${railTop}" x2="${marginX-10}" y2="${railBot}" style="stroke:var(--line-strong,#ccc);stroke-width:4;"/>`;
  svg += `<line x1="${marginX+10}" y1="${railTop}" x2="${marginX+10}" y2="${railBot}" style="stroke:var(--line-strong,#ccc);stroke-width:4;"/>`;
  for(let a=0;a<axleCount;a++){
    const cy = topPad + a*axleGap;
    const xs = positions.filter(p=>p.y===a).map(p=>marginX+p.x);
    svg += `<line x1="${Math.min(...xs)}" y1="${cy}" x2="${Math.max(...xs)}" y2="${cy}" style="stroke:var(--ink-faint,#999);stroke-width:3;"/>`;
  }
  positions.forEach(p=>{
    const cx = marginX + p.x, cy = topPad + p.y*axleGap;
    const tire = byPos[p.id];
    const fill = tire? colorVar(tire.estado) : 'var(--idle-soft)';
    const stroke = tire? colorVar(tire.estado) : 'var(--idle)';
    svg += `<g data-diagram-pos="${p.id}" style="cursor:pointer;">
      <circle cx="${cx}" cy="${cy}" r="${wheelR}" style="fill:${fill};stroke:${stroke};stroke-width:2;"></circle>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" style="font-size:10px;font-family:var(--font-mono);fill:#fff;pointer-events:none;">${p.id}</text>
    </g>`;
  });
  svg += `</svg>`;
  return svg;
}

function tireInspectionPayloadFromForm(d, tire){
  const kmChk = safeKm(d.inspectionKm||0);
  if(!kmChk.ok){ alert('El km de inspección es inválido o supera los 7 dígitos.'); return null; }
  const left = Number(d.treadLeftMm), center = Number(d.treadCenterMm), right = Number(d.treadRightMm);
  if([left,center,right].some(v=>isNaN(v)||v<0)){ alert('Las 3 medidas de cocada (Izq/Centro/Der) son obligatorias y deben ser números válidos.'); return null; }
  const psi = d.psi!==undefined && d.psi!==''? Number(d.psi) : null;
  if(psi!=null && isNaN(psi)){ alert('El PSI ingresado es inválido.'); return null; }
  return {
    tireId: tire.id, plate: tire.plate, position: tire.position, tireCode: tire.code||null,
    inspectionDate: d.inspectionDate||todayLocal(), inspectionKm: kmChk.value||0,
    treadLeftMm: left, treadCenterMm: center, treadRightMm: right,
    psi, route: d.route? d.route.trim().toUpperCase() : null
  };
}
// A partir de una medición + los datos del neumático (mountKm,
// initialTreadMm), calcula desgaste, velocidad de desgaste (km/mm) y
// proyecta a qué km habría que retirarlo — mismo método que la hoja
// REPORTES del Excel (Km/mm × cocada inicial = vida total proyectada).
function computeTireInspectionProjection(insp, tire){
  const treadAvg = (Number(insp.treadLeftMm)+Number(insp.treadCenterMm)+Number(insp.treadRightMm))/3;
  const mountKm = tire && tire.mountKm!=null? Number(tire.mountKm) : null;
  const initial = tire && tire.initialTreadMm!=null? Number(tire.initialTreadMm) : null;
  const kmRecorrido = mountKm!=null? Number(insp.inspectionKm)-mountKm : null;
  const worn = initial!=null? initial-treadAvg : null;
  const wearPct = (initial!=null && initial>0)? worn/initial : null;
  const kmPerMm = (kmRecorrido!=null && worn!=null && worn>0)? kmRecorrido/worn : null;
  const projectedTotalKm = (kmPerMm!=null && initial!=null)? kmPerMm*initial : null;
  const projectedRetirementKm = (projectedTotalKm!=null && mountKm!=null)? mountKm+projectedTotalKm : null;
  const kmRemaining = projectedRetirementKm!=null? projectedRetirementKm-Number(insp.inspectionKm) : null;
  return {treadAvg, kmRecorrido, wearPct, kmPerMm, projectedTotalKm, projectedRetirementKm, kmRemaining};
}

async function syncVehicleKmFromAllSources(plate){
  const vehicle = findVehicle(plate);
  if(!vehicle) return;
  // Combina las lecturas de Combustible y las del historial manual de
  // Kilometrajes, y toma la de fecha (y hora) MÁS RECIENTE entre ambas —
  // no el número más alto histórico — así un typo viejo con un valor
  // gigante no se queda "pegado" en Vehículos aunque no sea el dato más
  // actual.
  const candidates = [];
  state.fuelLogs.filter(f=>f.plate===plate && f.odometer!=null).forEach(f=> candidates.push({date:f.date, time:f.time, km:Number(f.odometer)}));
  state.vehicleKmLogs.filter(k=>k.plate===plate).forEach(k=> candidates.push({date:k.date, time:null, km:Number(k.km)}));
  if(candidates.length===0) return;
  const latest = [...candidates].sort((a,b)=> combineDateTime(b.date,b.time).getTime() - combineDateTime(a.date,a.time).getTime())[0];
  const currentKm = vehicle.km!=null? Number(vehicle.km) : null;
  if(currentKm===null || latest.km !== currentKm){
    const updated = await dbUpdate('vehicles', vehicle.id, {km:latest.km, kmUpdatedAt:new Date().toISOString()});
    if(updated){ vehicle.km = updated.km; vehicle.kmUpdatedAt = updated.kmUpdatedAt; }
  }
}
function fuelPayloadFromForm(d, excludeId){
  const noPlate = !!d.noPlate;
  let km = null;
  if(!noPlate){
    const kmCheck = safeKm(d.km);
    if(!kmCheck.ok){ alert('El KM ingresado es demasiado grande o inválido. Verifica el valor.'); return null; }
    km = kmCheck.value;
  }
  let pilotId = null, copilotId = null;
  if(!noPlate){
    const pilot = normalizeAndValidateDriverName(d.pilotName); if(pilot===null) return null;
    const copilot = normalizeAndValidateDriverName(d.copilotName); if(copilot===null) return null;
    pilotId = pilot.id; copilotId = copilot.id;
  }
  const gallons = Number(d.gallons)||0;
  const ppg = Number(d.ppg)||0;
  const isFull = d.isFullTank === 'true';
  return {
    voucherNumber: d.voucherNumber||null,
    date: d.date || todayLocal(),
    time: normalizeTime(d.time),
    plate: noPlate? null : d.plate,
    destination: noPlate? (d.destination? d.destination.trim().toUpperCase() : null) : null,
    odometer: noPlate? null : km,
    route: noPlate? null : (d.route||null),
    pilotId, copilotId,
    gallons, ppg,
    cost: Number((gallons*ppg).toFixed(2)),
    isFullTank: isFull,
    city: d.city? d.city.toUpperCase() : null,
    supplier: d.supplier? d.supplier.toUpperCase() : null,
    observations: d.observations||null
  };
}
function normalizeAndValidatePlate(raw){
  const p = (raw||'').toString().trim().toUpperCase();
  if(!p){ alert('Debes indicar una placa.'); return null; }
  if(!state.vehicles.some(v=>v.plate===p)){ alert(`La placa "${p}" no existe en el módulo de Vehículos y documentación. Regístrala ahí primero.`); return null; }
  return p;
}

async function handleFuelImportFile(file){
  const raw = await readExcelRows(file);
  if(!raw) return;

  const findDriverByName = (name)=>{
    if(!name) return null;
    const n = String(name).trim().toLowerCase();
    const found = state.drivers.find(d=> d.name.trim().toLowerCase()===n);
    return found? found.id : null;
  };

  const rows = []; let skippedNoPlate=0, noPlateCount=0, skippedBadDate=0, skippedBadKm=0;
  raw.forEach(r=>{
    const mapped = {};
    Object.keys(r).forEach(h=>{
      const field = FUEL_HEADER_MAP[normalizeHeader(h)];
      if(field) mapped[field] = r[h];
    });
    const plateRaw = (mapped.plate||'').toString().trim().toUpperCase();
    if(!plateRaw){ skippedNoPlate++; return; }
    // Si el texto de "Placa" no corresponde a ningún vehículo registrado, se
    // trata como consumo sin placa (taller, lavado de piezas, etc.) — igual
    // que el checkbox "No corresponde a una placa" del alta manual — usando
    // ese mismo texto como Destino/Motivo, en vez de descartar la fila.
    const knownVehicle = state.vehicles.some(v=>v.plate===plateRaw);
    if(!knownVehicle) noPlateCount++;
    const parsedDate = parseExcelDate(mapped.date);
    if(!parsedDate){ skippedBadDate++; return; }
    const kmCheck = safeKm(mapped.odometer);
    if(!kmCheck.ok){ skippedBadKm++; return; }
    const fullRaw = String(mapped.isFullTankRaw||'').trim().toLowerCase();
    const row = {
      plate: knownVehicle? plateRaw : null,
      destination: knownVehicle? null : plateRaw,
      voucherNumber: mapped.voucherNumber? String(mapped.voucherNumber).trim() : null,
      date: parsedDate,
      time: normalizeTime(mapped.time),
      odometer: kmCheck.value,
      route: mapped.route? String(mapped.route).trim() : null,
      pilotId: findDriverByName(mapped.pilotName),
      copilotId: findDriverByName(mapped.copilotName),
      gallons: parseNumberLoose(mapped.gallons) ?? 0,
      ppg: parseNumberLoose(mapped.ppg) ?? 0,
      isFullTank: ['si','sí','true','1','yes'].includes(fullRaw),
      city: mapped.city? stripTildes(String(mapped.city).trim().toUpperCase()) : null,
      supplier: mapped.supplier? stripTildes(String(mapped.supplier).trim().toUpperCase()) : null,
      observations: mapped.observations? String(mapped.observations).trim() : null
    };
    row.cost = Number(((row.gallons||0)*(row.ppg||0)).toFixed(2));
    rows.push(row);
  });
  if(rows.length===0){ alert('Ninguna fila tenía una placa, fecha y KM válidos — no se importó nada.'); return; }

  const skippedMsg = [skippedNoPlate? `${skippedNoPlate} sin placa`:null, skippedBadDate? `${skippedBadDate} con fecha no reconocida`:null, skippedBadKm? `${skippedBadKm} con KM fuera de rango válido`:null].filter(Boolean).join(', ');
  const proceed = confirm(`Se importarán ${rows.length} registro(s) de combustible` + (noPlateCount? ` (${noPlateCount} sin placa registrada en Vehículos — se guardan usando el texto de "Placa" como Destino/Motivo, igual que el alta manual)`:'') + `.` + (skippedMsg? `\nSe omitieron: ${skippedMsg}.`:'') + `\n\n¿Confirmar?`);
  if(!proceed) return;

  const {data:inserted, error} = await sb.from('fuel_logs').insert(rows.map(toSnake)).select();
  if(error){ alert('Error al importar: '+error.message); return; }
  await refreshFuelLogs();
  const touchedPlates = [...new Set(rows.map(r=>r.plate).filter(Boolean))];
  for(const p of touchedPlates){ await syncVehicleKmFromAllSources(p); }
  renderView();
  alert(`Importación completa: ${inserted.length} registro(s) de combustible guardados.`);
}

function fuelSortAccessor(f, key){
  if(key==='date') return combineDateTime(f.date, f.time).getTime();
  if(key==='pilot'){ const d=f.pilotId? findDriver(f.pilotId):null; return d? d.name:''; }
  if(key==='copilot'){ const d=f.copilotId? findDriver(f.copilotId):null; return d? d.name:''; }
  return f[key];
}
function sortFuelRows(rows){
  if(!filters.fuelSort){
    // Orden por defecto al abrir el módulo: Placa, luego Fecha, luego Hora
    return [...rows].sort((a,b)=>{
      const pa = a.plate||'', pb = b.plate||'';
      if(pa!==pb) return pa.localeCompare(pb,'es',{numeric:true});
      const da = a.date||'', db = b.date||'';
      if(da!==db) return da.localeCompare(db,'es',{numeric:true});
      return (a.time||'').localeCompare(b.time||'','es',{numeric:true});
    });
  }
  return sortGenericRows(rows, filters.fuelSort, undefined, undefined, fuelSortAccessor);
}
function filterFuelRows(rows){
  return rows.filter(f=>{
    const vale = filters.fuelVale.toLowerCase();
    const route = filters.fuelRoute.toLowerCase();
    const matchVale = !vale || (f.voucherNumber||'').toLowerCase().includes(vale);
    const matchRoute = !route || (f.route||'').toLowerCase().includes(route);
    const matchPlate = !filters.fuelPlate || f.plate===filters.fuelPlate;
    const matchCity = !filters.fuelCity || f.city===filters.fuelCity;
    const matchSupplier = !filters.fuelSupplier || f.supplier===filters.fuelSupplier;
    const matchFrom = !filters.fuelDateFrom || (f.date && f.date>=filters.fuelDateFrom);
    const matchTo = !filters.fuelDateTo || (f.date && f.date<=filters.fuelDateTo);
    return matchVale && matchRoute && matchPlate && matchCity && matchSupplier && matchFrom && matchTo;
  });
}

function incrementVoucherNumber(v){
  if(!v) return '';
  const m = String(v).match(/^(.*?)(\d+)(\D*)$/);
  if(!m) return '';
  const [, prefix, digits, suffix] = m;
  const next = String(Number(digits)+1).padStart(digits.length, '0');
  return prefix + next + suffix;
}
function openFuelRegisterModal(prefill, justSaved){
  openModal(justSaved? 'Registrar carga de combustible — ✓ vale anterior guardado, listo para el siguiente' : 'Registrar carga de combustible', fuelFormBody(prefill||{}), async (d)=>{
    if(d.noPlate){
      if(!d.destination || !d.destination.trim()){ alert('Indica el destino o motivo (ej. Taller Central - Lavado de piezas).'); return; }
    } else {
      const plate = normalizeAndValidatePlate(d.plate); if(!plate) return; d.plate = plate;
    }
    const payload = fuelPayloadFromForm(d); if(!payload) return;
    if(!d.noPlate && payload.odometer!=null){
      const anomalyInfo = checkKmAnomaly(payload.plate, payload.odometer);
      if(anomalyInfo.anomaly){
        const proceed = await confirmKmAnomalyWindow(payload.plate, payload.odometer, anomalyInfo);
        if(!proceed){ openFuelRegisterModal(payload); return; }
      }
    }
    const created = await dbInsert('fuel_logs', payload);
    if(created){
      await refreshFuelLogs();
      if(!d.noPlate) await syncVehicleKmFromAllSources(d.plate);
      renderView();
      // Mantiene el formulario abierto para cargar el siguiente vale: sube el
      // N° de vale en 1 y conserva Fecha, Ciudad y Proveedor — siempre se

function getAllProviders(){

function renderFuelPrecios(){

  document.getElementById('fuel-subview').innerHTML = `

        <div><label>Fecha hasta</label><input id="p-to" type="date" value="${filters.priceDateTo}"></div>
        <div></div>
      </div>
      <label>Proveedores</label>
      <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px;">
        ${allProviders.map(p=>`
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:normal;color:var(--ink);">
            <input type="checkbox" class="p-provider-chk" value="${p}" ${filters.priceProviders.has(p)?'checked':''}> ${p}
          </label>
        `).join('') || '<div class="empty">Todavía no hay proveedores registrados en Combustible.</div>'}
      </div>
    </div>
    <div id="price-dashboard"></div>
    <div id="price-chart-container"></div>
  `;
  wireFilterBar([
    {id:'p-from', key:'priceDateFrom'}, {id:'p-to', key:'priceDateTo'}
  ], renderPriceDashboardAndChart);
  document.querySelectorAll('.p-provider-chk').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      if(chk.checked) filters.priceProviders.add(chk.value); else filters.priceProviders.delete(chk.value);
      renderPriceDashboardAndChart();
    });
  });
  renderPriceDashboardAndChart();
}
function renderPriceDashboardAndChart(){
  const allProviders = getAllProviders();
  const selected = allProviders.filter(p=>filters.priceProviders.has(p));

  // Dashboard: precio más reciente, solo de los proveedores marcados arriba que sí tengan precio
  const currentPrices = selected.map(p=>{
    const entries = state.fuelLogs.filter(f=> f.supplier===p && f.ppg!=null).sort((a,b)=> combineDateTime(b.date,b.time)-combineDateTime(a.date,a.time));
    return entries.length? {provider:p, ppg:Number(entries[0].ppg), date:entries[0].date} : null;
  }).filter(Boolean);
  document.getElementById('price-dashboard').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>Precio actual por proveedor</h3><div class="hint">Último precio (PPG) registrado de cada uno seleccionado</div></div>
      <div class="grid kpi-row">
        ${currentPrices.map(cp=>`
          <div class="kpi">
            <div class="label">${cp.provider}</div>
            <div class="value">S/ ${cp.ppg.toFixed(2)}</div>
            <div class="delta">${fmtDateDMY(cp.date)}</div>
          </div>
        `).join('') || (selected.length? '<div class="empty">Los proveedores seleccionados no tienen precio registrado.</div>' : '<div class="empty">Selecciona al menos un proveedor arriba.</div>')}
      </div>
    </div>
  `;

  // Línea de tiempo
  const inRange = (f)=>{
    if(filters.priceDateFrom && f.date < filters.priceDateFrom) return false;
    if(filters.priceDateTo && f.date > filters.priceDateTo) return false;
    return true;
  };
  const filteredLogs = state.fuelLogs.filter(f=> f.supplier && selected.includes(f.supplier) && f.ppg!=null && inRange(f));
  const labels = [...new Set(filteredLogs.map(f=>f.date))].sort((a,b)=>a.localeCompare(b));
  const container = document.getElementById('price-chart-container');

  if(priceChartInstance){ priceChartInstance.destroy(); priceChartInstance = null; }

  if(labels.length===0 || selected.length===0){
    container.innerHTML = `<div class="card"><div class="card-head"><h3>Evolución del precio (PPG) por proveedor</h3></div><div class="empty">No hay datos para los filtros seleccionados.</div></div>`;
    return;
  }
  container.innerHTML = `<div class="card"><div class="card-head"><h3>Evolución del precio (PPG) por proveedor</h3></div><div style="position:relative;height:360px;"><canvas id="price-chart"></canvas></div></div>`;

  const colors = ['#2F6FED','#2E9E6C','#C9861E','#D5473C','#8A5CF6','#0EA5B7','#DB2777'];
  const datasets = selected.map((p,i)=>{
    const byDate = {};
    filteredLogs.filter(f=>f.supplier===p)
      .sort((a,b)=> combineDateTime(a.date,a.time) - combineDateTime(b.date,b.time))
      .forEach(f=>{ byDate[f.date]=Number(f.ppg); }); // si hay varios el mismo día, queda el más reciente de ese día
    return {
      label: p,
      data: labels.map(l=> byDate.hasOwnProperty(l)? byDate[l] : null),
      borderColor: colors[i%colors.length],
      backgroundColor: colors[i%colors.length],
      spanGaps: true,
      tension: 0.15
    };
  });
  const ctx = document.getElementById('price-chart');
  if(typeof Chart === 'undefined'){
    container.innerHTML = `<div class="card"><div class="card-head"><h3>Evolución del precio (PPG) por proveedor</h3></div><div class="empty">No se pudo cargar la librería de gráficos (Chart.js). Verifica tu conexión a internet y refresca la página.</div></div>`;
    return;
  }
  priceChartInstance = new Chart(ctx, {
    type:'line',
    data:{ labels: labels.map(l=>fmtDateDMY(l)), datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom'} },
      scales:{ y:{ title:{display:true, text:'S/ por galón'} } }
    }
  });
}

let consumoSolesChartInstance = null;
// Núcleo compartido entre Combustible > Consumos y Reportes > Combustible >
// Proveedores: resumen de soles/galones por proveedor + dos gráficos de
// barras apiladas por día. Ambas pantallas ya arman el mismo pipeline por
// separado; esto lo deja en un solo lugar — cada caller solo aporta su
// rango de fechas/filtro de placa, los ids de contenedor y cómo maneja su
// propia instancia de Chart.js.
function renderProviderFuelSummaryAndCharts(cfg){
  const filteredLogs = state.fuelLogs.filter(f=> f.supplier && cfg.selected.includes(f.supplier) && (!cfg.plateOk || cfg.plateOk(f.plate)) && cfg.inRange(f.date));

  let daysInRange;
  if(cfg.dateFrom && cfg.dateTo){
    const d1 = new Date(cfg.dateFrom+'T00:00:00'), d2 = new Date(cfg.dateTo+'T00:00:00');
    daysInRange = Math.max(1, Math.round((d2-d1)/86400000)+1);
  } else {
    daysInRange = Math.max(1, new Set(filteredLogs.map(f=>f.date)).size);
  }

  let summary = cfg.selected.map(p=>{
    const logs = filteredLogs.filter(f=>f.supplier===p);
    const totalCost = logs.reduce((a,f)=>a+Number(f.cost||0),0);
    const totalGallons = logs.reduce((a,f)=>a+Number(f.gallons||0),0);
    return {provider:p, totalCost, totalGallons, avgCost: totalCost/daysInRange, avgGallons: totalGallons/daysInRange};
  });
  summary.sort((a,b)=>b.totalCost-a.totalCost);
  const grandCost = summary.reduce((a,s)=>a+s.totalCost,0);
  const grandGallons = summary.reduce((a,s)=>a+s.totalGallons,0);
  document.getElementById(cfg.summaryContainerId).innerHTML = `
    <div class="card">
      <div class="card-head"><h3>Consumo por proveedor</h3><div class="hint">Soles y galones consumidos en el rango seleccionado, de mayor a menor — promedio diario sobre ${daysInRange} día(s)</div></div>
      <div class="grid kpi-row">
        ${summary.map(s=>`
          <div class="kpi">
            <div class="label">${s.provider}</div>
            <div class="value">S/ ${s.totalCost.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
            <div class="delta">${s.totalGallons.toLocaleString('es-PE',{maximumFractionDigits:2})} gal</div>
            <div class="delta">Promedio diario: S/ ${s.avgCost.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})} · ${s.avgGallons.toLocaleString('es-PE',{maximumFractionDigits:2})} gal</div>
          </div>
        `).join('') || (cfg.selected.length? '<div class="empty">Los proveedores seleccionados no tienen consumo registrado en este rango.</div>' : '<div class="empty">Selecciona al menos un proveedor arriba.</div>')}
        ${summary.length>1? `
          <div class="kpi" style="background:var(--surface-2,var(--surface));">
            <div class="label">Total</div>
            <div class="value">S/ ${grandCost.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
            <div class="delta">${grandGallons.toLocaleString('es-PE',{maximumFractionDigits:2})} gal</div>
            <div class="delta">Promedio diario: S/ ${(grandCost/daysInRange).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})} · ${(grandGallons/daysInRange).toLocaleString('es-PE',{maximumFractionDigits:2})} gal</div>
          </div>` : ''}
      </div>
    </div>
  `;

  const labels = [...new Set(filteredLogs.map(f=>f.date))].sort((a,b)=>a.localeCompare(b));
  const volContainer = document.getElementById(cfg.volContainerId);
  const solesContainer = document.getElementById(cfg.solesContainerId);
  const colors = ['#2F6FED','#2E9E6C','#C9861E','#D5473C','#8A5CF6','#0EA5B7','#DB2777'];

  cfg.destroyInstances();

  if(labels.length===0 || cfg.selected.length===0){
    volContainer.innerHTML = `<div class="card"><div class="card-head"><h3>Volumen consumido (galones) por día</h3></div><div class="empty">No hay datos para los filtros seleccionados.</div></div>`;
    solesContainer.innerHTML = `<div class="card"><div class="card-head"><h3>Consumo (soles) por día</h3></div><div class="empty">No hay datos para los filtros seleccionados.</div></div>`;
    return;
  }
  if(typeof Chart === 'undefined'){
    volContainer.innerHTML = `<div class="card"><div class="card-head"><h3>Volumen consumido (galones) por día</h3></div><div class="empty">No se pudo cargar la librería de gráficos (Chart.js). Verifica tu conexión a internet y refresca la página.</div></div>`;
    solesContainer.innerHTML = '';
    return;
  }

  volContainer.innerHTML = `<div class="card"><div class="card-head"><h3>Volumen consumido (galones) por día</h3></div><div style="position:relative;height:360px;"><canvas id="${cfg.volCanvasId}"></canvas></div></div>`;
  const gallonsDatasets = cfg.selected.map((p,i)=>{
    const byDate = {};
    filteredLogs.filter(f=>f.supplier===p).forEach(f=>{ byDate[f.date] = (byDate[f.date]||0) + Number(f.gallons||0); });
    return { label:p, data: labels.map(l=> byDate.hasOwnProperty(l)? Number(byDate[l].toFixed(2)) : 0), backgroundColor: colors[i%colors.length], borderColor: colors[i%colors.length], stack:'volumen' };
  });
  const volChart = new Chart(document.getElementById(cfg.volCanvasId), {
    type:'bar', data:{ labels: labels.map(l=>fmtDateDMY(l)), datasets: gallonsDatasets },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'bottom'} }, scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true, text:'Galones'}} } }
  });

  solesContainer.innerHTML = `<div class="card"><div class="card-head"><h3>Consumo (soles) por día</h3></div><div style="position:relative;height:360px;"><canvas id="${cfg.solesCanvasId}"></canvas></div></div>`;
  const solesDatasets = cfg.selected.map((p,i)=>{
    const byDate = {};
    filteredLogs.filter(f=>f.supplier===p).forEach(f=>{ byDate[f.date] = (byDate[f.date]||0) + Number(f.cost||0); });
    return { label:p, data: labels.map(l=> byDate.hasOwnProperty(l)? Number(byDate[l].toFixed(2)) : 0), backgroundColor: colors[i%colors.length], borderColor: colors[i%colors.length], stack:'soles' };
  });
  const solesChart = new Chart(document.getElementById(cfg.solesCanvasId), {
    type:'bar', data:{ labels: labels.map(l=>fmtDateDMY(l)), datasets: solesDatasets },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'bottom'} }, scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true, text:'S/'}} } }
  });
  cfg.setInstances(volChart, solesChart);
}
function renderConsumoDashboardAndChart(){
  const allProviders = getAllProviders();
  const selected = allProviders.filter(p=>filters.consumoProviders.has(p));
  renderProviderFuelSummaryAndCharts({
    selected,
    dateFrom: filters.consumoDateFrom, dateTo: filters.consumoDateTo,
    inRange: (date)=> (!filters.consumoDateFrom || date>=filters.consumoDateFrom) && (!filters.consumoDateTo || date<=filters.consumoDateTo),
    plateOk: null,
    summaryContainerId:'consumo-dashboard', volContainerId:'consumo-chart-container', solesContainerId:'consumo-soles-chart-container',
    volCanvasId:'consumo-chart', solesCanvasId:'consumo-soles-chart',
    destroyInstances: ()=>{
      if(consumoChartInstance){ consumoChartInstance.destroy(); consumoChartInstance=null; }
      if(consumoSolesChartInstance){ consumoSolesChartInstance.destroy(); consumoSolesChartInstance=null; }
    },
    setInstances: (vol,soles)=>{ consumoChartInstance=vol; consumoSolesChartInstance=soles; }
  });
}

function hasActiveFuelFilters(){
  return !!(filters.fuelVale || filters.fuelRoute || filters.fuelDateFrom || filters.fuelDateTo ||
    !!filters.fuelPlate || !!filters.fuelCity || !!filters.fuelSupplier);
}
function updateFuelTable(){
  const active = hasActiveFuelFilters();
  let rows = active? sortFuelRows(filterFuelRows(state.fuelLogs)) : [];

  const totalCost = rows.reduce((a,f)=>a+Number(f.cost||0),0);
  const totalGallons = rows.reduce((a,f)=>a+Number(f.gallons||0),0);
  const kpgVals = rows.map(f=>f.kpg).filter(v=>v!==null && v!==undefined && !isNaN(v)).map(Number);
  const avgKpg = kpgVals.length? kpgVals.reduce((a,b)=>a+b,0)/kpgVals.length : null;
  const ppgVals = rows.map(f=>f.ppg).filter(v=>v!==null && v!==undefined && !isNaN(v)).map(Number);
  const avgPpg = ppgVals.length? ppgVals.reduce((a,b)=>a+b,0)/ppgVals.length : null;
  const kmRecoVals = rows.map(f=>f.kmReco).filter(v=>v!==null && v!==undefined && !isNaN(v)).map(Number);
  const sumKmReco = kmRecoVals.reduce((a,b)=>a+b,0);

  document.getElementById('fuel-kpi-container').innerHTML = `
    <div class="grid kpi-row">
      <div class="kpi"><div class="label">Gasto en combustible</div><div class="value">${active? 'S/ '+Math.round(totalCost).toLocaleString('es-PE'):'—'}</div></div>
      <div class="kpi"><div class="label">Galones consumidos</div><div class="value">${active? totalGallons.toLocaleString('es-PE',{maximumFractionDigits:1}):'—'}</div></div>
      <div class="kpi"><div class="label">Registros totales</div><div class="value">${active? rows.length:'—'}</div></div>
      <div class="kpi"><div class="label">KPG (promedio)</div><div class="value">${active && avgKpg!==null? avgKpg.toLocaleString('es-PE',{maximumFractionDigits:2}):'—'}</div></div>
      <div class="kpi"><div class="label">PPG (promedio)</div><div class="value">${active && avgPpg!==null? 'S/ '+avgPpg.toFixed(3):'—'}</div></div>
      <div class="kpi"><div class="label">Suma Km Recorrido</div><div class="value">${active? sumKmReco.toLocaleString('es-PE'):'—'}</div></div>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);margin:-6px 0 14px 2px;">${active? 'Calculado sobre los registros filtrados.' : 'Aplica al menos un filtro (N° de vale, ruta, placa, fecha, ciudad o proveedor) para ver los datos.'}</div>
  `;

  if(!active){
    document.getElementById('fuel-table-container').innerHTML = `<div class="empty">Selecciona un filtro arriba para mostrar los registros de combustible.</div>`;
    return;
  }

  document.getElementById('fuel-table-container').innerHTML = `
      <div class="table-scroll" id="fuel-table-wrap"><table id="fuel-table">
        <thead><tr>${FUEL_COLUMNS.map(c=>{
          const isActive = filters.fuelSort && filters.fuelSort.key===c.key;
          const arrow = isActive? (filters.fuelSort.dir==='asc'? ' ▲':' ▼') : '';
          return `<th class="sortable-th" data-fuel-sort-key="${c.key}">${c.label}${arrow}</th>`;
        }).join('')}${canWrite()?'<th></th>':''}</tr></thead>
        <tbody>${rows.map(f=>{
          const pilot = f.pilotId? findDriver(f.pilotId) : null;
          const copilot = f.copilotId? findDriver(f.copilotId) : null;
          return `<tr>
            <td class="mono">${f.voucherNumber||'—'}</td><td>${fmtDateDMY(f.date)}</td><td class="mono">${f.time||'—'}</td><td class="mono">${f.plate || `<span style="color:var(--ink-soft);font-style:italic;">${f.destination||'Sin placa'}</span>`}</td>
            <td class="mono">${f.odometer!=null? Number(f.odometer).toLocaleString('es-PE'):'—'}</td><td>${f.route||'—'}</td>
            <td>${pilot?pilot.name:'—'}</td><td>${copilot?copilot.name:'—'}</td>
            <td class="mono">${f.gallons!=null? Number(f.gallons).toLocaleString('es-PE',{maximumFractionDigits:2}):'—'}</td>
            <td class="mono">${f.kmReco!=null? Number(f.kmReco).toLocaleString('es-PE'):'—'}</td>
            <td class="mono">${f.kpg!=null? Number(f.kpg).toLocaleString('es-PE',{maximumFractionDigits:2}):'—'}</td>
            <td>${fmtMoney(f.cost)}</td><td class="mono">${f.ppg!=null? Number(f.ppg).toFixed(3):'—'}</td>
            <td>${f.city||'—'}</td><td>${f.supplier||'—'}</td>
            ${canWrite()?`<td><button class="btn btn-sm" data-fuel-edit="${f.id}">Editar</button> <button class="btn btn-sm btn-danger" data-fuel-del="${f.id}">Eliminar</button></td>`:''}
          </tr>`;
        }).join('') || `<tr><td colspan="16"><div class="empty">No se encontraron registros con estos filtros.</div></td></tr>`}</tbody>
      </table></div>`;
  document.querySelectorAll('[data-fuel-sort-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.fuelSortKey;
      if(filters.fuelSort && filters.fuelSort.key===key){ filters.fuelSort.dir = filters.fuelSort.dir==='asc'?'desc':'asc'; }
      else { filters.fuelSort = {key, dir:'asc'}; }
      updateFuelTable();
    });
  });
  if(canWrite()){
    function openFuelEditModal(f, oldPlate, prefillOverride){
      openModal(`Editar registro — ${f.plate||f.destination||'—'}`, fuelFormBody(prefillOverride||f), async (d)=>{
        if(d.noPlate){
          if(!d.destination || !d.destination.trim()){ alert('Indica el destino o motivo (ej. Taller Central - Lavado de piezas).'); return; }
        } else {
          const plate = normalizeAndValidatePlate(d.plate); if(!plate) return; d.plate = plate;
        }
        const patch = fuelPayloadFromForm(d, f.id); if(!patch) return;
        if(!d.noPlate && patch.odometer!=null){
          const anomalyInfo = checkKmAnomaly(patch.plate, patch.odometer);
          if(anomalyInfo.anomaly){
            const proceed = await confirmKmAnomalyWindow(patch.plate, patch.odometer, anomalyInfo);
            if(!proceed){ openFuelEditModal(f, oldPlate, patch); return; }
          }
        }
        const updated = await dbUpdate('fuel_logs', f.id, patch);
        if(updated){
          await refreshFuelLogs();
          // Recalcula tanto la placa anterior (por si se le quitó o cambió esta
          // lectura) como la nueva, para no dejar KM viejos/erróneos en Vehículos.
          if(oldPlate) await syncVehicleKmFromAllSources(oldPlate);
          if(!d.noPlate && d.plate && d.plate!==oldPlate) await syncVehicleKmFromAllSources(d.plate);
          closeModal(); renderView();
        }
      }, 'Guardar cambios');
      wireFuelNoPlateToggle();
    }
    document.querySelectorAll('[data-fuel-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const f = state.fuelLogs.find(x=>x.id===btn.dataset.fuelEdit);
        openFuelEditModal(f, f.plate);
      });
    });
    document.querySelectorAll('[data-fuel-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('¿Eliminar este registro de combustible? Esta acción no se puede deshacer.')) return;
        const f = state.fuelLogs.find(x=>x.id===btn.dataset.fuelDel);
        const {error} = await sb.from('fuel_logs').delete().eq('id', btn.dataset.fuelDel);
        if(error){ alert('No se pudo eliminar: '+error.message); return; }
        await refreshFuelLogs();
        if(f && f.plate) await syncVehicleKmFromAllSources(f.plate);
        renderView();
      });
    });
  }
}

function computeNextPoNumber(){
  if(state.purchaseOrders.filter(o=>o.poNumber!=null).length===0) return 1001;
  return Math.max(1000, ...state.purchaseOrders.map(o=>Number(o.poNumber)||0)) + 1;
}
// Un centro de costo escrito distinto a la placa ("T7W 852", "t7w852") no
// calza con "T7W-852" en Costos, Reportes ni Consultas y su gasto se pierde
// del total de esa unidad. Al guardar se usa la escritura oficial de la
// placa (o del centro de costo/sede ya existente) si coincide ignorando
// espacios, guiones y mayúsculas; si no coincide con ninguno, se respeta
// lo escrito (oficinas, talleres nuevos).
function canonicalCostCenter(raw){
  const typed = (raw||'').toString().trim().toUpperCase();
  if(!typed) return null;
  const norm = (s)=> (s||'').toString().toUpperCase().replace(/[^A-Z0-9]/g,'');
  const n = norm(typed);
  const plate = state.vehicles.find(v=> norm(v.plate)===n);
  if(plate) return plate.plate;
  const existing = costCenterOptions().find(c=> norm(c)===n);
  return existing || typed;
}
function costCenterOptions(){
  const plates = state.vehicles.map(v=>v.plate);
  const sedes = catalogValues('sede');
  const custom = catalogValues('centro_costo');
  return [...new Set([...custom, ...plates, ...sedes])].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
}
