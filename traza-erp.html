// Un ítem de Orden de Compra es Producto o Servicio. Un Servicio siempre
// tiene Centro de Costo (no maneja stock). Un Producto tiene Centro de
// Costo opcional: vacío (el default) = ingresa a Almacén y sale después a
// un centro de costo vía Orden Logística; definido = se carga directo a
// ese centro de costo y no pasa por stock (ej. una compra puntual para un
// trabajo específico, no para inventario general).
// Identidad de un producto: el mismo nombre puede repetirse con distinta
// marca / código de fabricante (ver products_identity_key en schema.sql).
// Cuando el nombre está repetido, los pickers muestran "NOMBRE · MARCA · COD.
// FAB." para poder distinguirlos; si el nombre es único, sigue siendo solo el
// nombre. Lo guardado en OC/OL usa productId, no este texto.
function productLabelIndex(){
  const counts = new Map();
  state.products.forEach(p=>{ const k=(p.name||'').trim().toUpperCase(); counts.set(k,(counts.get(k)||0)+1); });
  const labelOf = (p)=> (counts.get((p.name||'').trim().toUpperCase())||0)>1 ? [p.name,p.brand,p.oemCode].filter(Boolean).join(' · ') : p.name;
  return {counts, labelOf};
}
function productLabel(p){ return productLabelIndex().labelOf(p); }
function productIdentityKey(name, brand, oemCode){
  return [name, brand, oemCode].map(x=>(x||'').toString().trim().toUpperCase()).join('|');
}
// Devuelve el producto que corresponde al texto del picker, o null si no
// existe o si el nombre solo es ambiguo (hay varios con ese nombre).
function findProductByLabel(value){
  const v = (value||'').trim().toUpperCase();
  if(!v) return null;
  const {counts, labelOf} = productLabelIndex();
  const byLabel = state.products.find(p=>labelOf(p).trim().toUpperCase()===v);
  if(byLabel) return byLabel;
  if((counts.get(v)||0)===1) return state.products.find(p=>(p.name||'').trim().toUpperCase()===v);
  if((counts.get(v)||0)>1) return null;
  const byCode = state.products.find(p=>p.code && p.code.toUpperCase()===v);
  if(byCode) return byCode;
  const byOem = state.products.filter(p=>p.oemCode && p.oemCode.toUpperCase()===v);
  return byOem.length===1? byOem[0] : null;
}
// Opciones del buscador de producto: por nombre (con marca/código si el
// nombre se repite) y también escribiendo el código o el código de fabricante.
function productPickerOptions(products, labelOf){
  const sel=(v)=> v===undefined||v===null?'':v;
  return products.map(p=>`<option value="${sel(labelOf(p))}">${p.code?'Cód. '+sel(p.code):''}${p.brand?' · '+sel(p.brand):''}</option>`).join('')
    + products.filter(p=>p.code).map(p=>`<option value="${sel(p.code)}">${sel(labelOf(p))}</option>`).join('')
    + products.filter(p=>p.oemCode).map(p=>`<option value="${sel(p.oemCode)}">${sel(labelOf(p))}</option>`).join('');
}
function productNameIsAmbiguous(value){
  const v = (value||'').trim().toUpperCase();
  return !!v && state.products.filter(p=>(p.name||'').trim().toUpperCase()===v).length>1 && !findProductByLabel(value);
}

    <div class="form-row">

  // Enlace opcional Servicio → Neumático en Reencauche: al registrar el

  return `

    <div id="po-item-create-hint" style="margin:4px 0 12px;"></div>

// Último costo unitario pagado por un producto/servicio, según sus propios
// ítems de OC ya registrados (más reciente primero por fecha de pedido de
// esa OC). Se usa para prellenar "Costo (unitario)" al elegir el ítem en
// "Agregar ítem al pedido" — referencia rápida, el usuario igual puede
// cambiarlo si el precio de esta compra es distinto.
function lastUnitCostFor(itemType, matchId, productName){
  const idField = itemType==='SERVICIO'? 'serviceId' : 'productId';
  const candidates = state.purchaseOrderItems.filter(i=>{
    if(i.itemType!==itemType) return false;
    if(i.unitCost==null) return false;
    if(matchId && i[idField]) return i[idField]===matchId;
    return (i.productName||'').trim().toUpperCase()===(productName||'').trim().toUpperCase();
  });
  if(candidates.length===0) return null;
  candidates.sort((a,b)=>{
    const poA = state.purchaseOrders.find(p=>p.id===a.purchaseOrderId);
    const poB = state.purchaseOrders.find(p=>p.id===b.purchaseOrderId);
    const dateA = (poA&&poA.orderDate) || a.createdAt || '';
    const dateB = (poB&&poB.orderDate) || b.createdAt || '';
    return dateB.localeCompare(dateA);
  });
  return Number(candidates[0].unitCost);
}
function wirePoProductSelect(po, existingItem){
  const nameInput = document.querySelector('#modal-form [name="productName"]');
  const typeSelect = document.getElementById('po-item-type');
  const hint = document.getElementById('po-item-create-hint');
  if(!nameInput) return;
  const update = (isUserTriggered)=>{
    const isService = typeSelect && typeSelect.value==='SERVICIO';
    const list = isService? state.services : state.products;
    const match = isService? list.find(x=>x.name===nameInput.value || (x.code && x.code===nameInput.value)) : findProductByLabel(nameInput.value);
    const codeInput = document.getElementById('po-item-code-input');
    const oemInput = document.getElementById('po-item-oem-input');
    const unitInput = document.getElementById('po-item-unit-input');
    if(codeInput) codeInput.value = match? (match.code||'') : '';
    if(oemInput) oemInput.value = match? (match.oemCode||'') : '';
    if(unitInput) unitInput.value = match? (match.unit||'') : '';
    // El costo unitario solo se autocompleta cuando el usuario elige/escribe
    // el ítem — no al abrir el modal para editar uno ya guardado (ese valor
    // ya tiene su propio costo, no el "último precio" genérico).
    if(isUserTriggered && match){
      const unitCostInput = document.querySelector('#modal-form [name="unitCost"]');
      const last = lastUnitCostFor(isService?'SERVICIO':'PRODUCTO', match.id, match.name);
      if(unitCostInput) unitCostInput.value = last!=null? last : (match.cost!=null? match.cost : '');
    }
    if(hint){
      const v = nameInput.value.trim();
      hint.innerHTML = (v && !match)
        ? (!isService && productNameIsAmbiguous(v)
          ? `<span style="font-size:12px;color:var(--warn);">Hay varios productos con ese nombre — elige uno de la lista (marca / cód. fabricante), o</span> <button type="button" class="btn btn-sm" id="po-item-create-btn">Crear producto nuevo</button>`
          : `<span style="font-size:12px;color:var(--warn);">Ese ${isService?'servicio':'producto'} no existe.</span> <button type="button" class="btn btn-sm" id="po-item-create-btn">Crear ${isService?'servicio':'producto'} nuevo</button>`)
        : '';
      const btn = document.getElementById('po-item-create-btn');
      if(btn) btn.addEventListener('click', ()=> openCatalogQuickCreateFromPoItem(v, isService, po, existingItem));
    }
  };
  nameInput.addEventListener('input', ()=>update(true));
  update(false);
}
// Crear el producto/servicio que falta sin salir del "Agregar ítem al
// pedido" — mismo patrón ya usado en Logística (openProductQuickCreateFromLoItem).
function openCatalogQuickCreateFromPoItem(typedName, isService, po, existingItem){
  const form = document.getElementById('modal-form');
  const val = (name)=>{ const el = form.querySelector(`[name="${name}"]`); return el? el.value : ''; };
  const itemsCount = state.purchaseOrderItems.filter(i=>i.purchaseOrderId===po.id).length;
  const prefill = {
    itemType: isService?'SERVICIO':'PRODUCTO', productName: typedName,
    quantity: val('quantity'), unitCost: val('unitCost'), costCenter: val('costCenter'),
    workOrderNumber: val('workOrderNumber'), workOrderItemId: val('workOrderItemId')
  };
  if(isService){
    const code = computeNextServiceCode();
    openModal(`Nuevo servicio — Cód. ${code}`, serviceFormBody({name:typedName}), async (d)=>{
      const payload = await servicePayloadFromForm(d, code); if(!payload) return;
      const created = await dbInsert('services', payload);
      if(!created) return;
      state.services.push(created);
      if(!prefill.unitCost) prefill.unitCost = created.cost;
      openPoItemModal(po, itemsCount, existingItem, prefill);
    }, 'Crear servicio y continuar');
    wireServiceTaxonomy();
  } else {
    const code = computeNextProductCode();
    openModal(`Nuevo producto — Cód. ${code}`, productFormBody({name:typedName}), async (d)=>{
      const payload = await productPayloadFromForm(d, code); if(!payload) return;
      const created = await dbInsert('products', payload);
      if(!created) return;
      state.products.push(created);
      prefill.productName = productLabel(created);
      if(!prefill.unitCost) prefill.unitCost = created.cost;
      openPoItemModal(po, itemsCount, existingItem, prefill);
    }, 'Crear producto y continuar');
    wireProductTaxonomy();
  }
}
function openPoItemModal(po, itemsCount, existingItem, prefillOverride){
  const isEdit = !!(existingItem && existingItem.id);
  const formItem = prefillOverride || existingItem;
  const title = isEdit? 'Editar ítem' : 'Agregar ítem al pedido';
  openModal(title, poItemFormBody(formItem, po), async (d)=>{
    const payload = await poItemPayloadFromForm(d); if(!payload) return;
    if(isEdit){
      const updated = await dbUpdate('purchase_order_items', existingItem.id, payload);
      if(updated){ Object.assign(existingItem, updated); closeModal(); renderView(); }
    } else {
      payload.purchaseOrderId = po.id;
      payload.sortOrder = itemsCount;
      const created = await dbInsert('purchase_order_items', payload);
      if(created){ state.purchaseOrderItems.push(created); closeModal(); renderView(); }
    }
  }, isEdit? 'Guardar cambios' : 'Agregar');
  wirePoProductSelect(po, existingItem);
  wirePoItemTypeToggle(po);
  wirePoItemOtLink(po);
  wirePoTireLink();
}
// Enlace opcional Servicio → OT (+ trabajo específico dentro de ella). Al
// escribir una OT abierta válida se bloquea Centro de Costo con la placa
// de esa OT (igual que ya hace Logística) y se llena el selector de
// trabajos con los de esa OT. No aplica a Producto: ese campo no existe
// en su rama del formulario, así que la función simplemente no hace nada.
function wirePoItemOtLink(po){
  const jobSelect = document.querySelector('#modal-form [name="workOrderItemId"]');
  if(!jobSelect) return;
  // OC anexada a una OT en la cabecera: la OT ya está fija (inputs ocultos
  // en el formulario) — solo hace falta llenar el selector de trabajos.
  const anexedOt = po && po.workOrderNumber!=null? state.workOrders.find(o=>Number(o.otNumber)===Number(po.workOrderNumber)) : null;
  if(anexedOt){
    const jobs = state.workOrderItems.filter(i=>i.workOrderId===anexedOt.id);
    const preselectId = jobSelect.dataset.initial || '';
    jobSelect.innerHTML = `<option value="">General (toda la OT)</option>` + jobs.map(j=>`<option value="${j.id}" ${j.id===preselectId?'selected':''}>${(j.requestedJob||'Trabajo sin descripción').slice(0,60)}</option>`).join('');
    return;
  }
  const otInput = document.querySelector('#modal-form [name="workOrderNumber"]');
  const ccInput = document.querySelector('#modal-form [name="costCenter"]');
  const otList = document.getElementById('po-item-ot-list');
  if(!otInput || !ccInput) return;
  const buildJobs = (ot, preselectId)=>{
    const jobs = ot? state.workOrderItems.filter(i=>i.workOrderId===ot.id) : [];
    jobSelect.innerHTML = `<option value="">General (toda la OT)</option>` + jobs.map(j=>`<option value="${j.id}" ${j.id===preselectId?'selected':''}>${(j.requestedJob||'Trabajo sin descripción').slice(0,60)}</option>`).join('');
  };
  // El datalist de N° de OT solo debe ofrecer OTs abiertas de la placa que
  // ya se escribió en Centro de Costo — evita listar OTs de otras unidades.
  const refreshOtList = ()=>{
    if(!otList) return;
    const t = ccInput.value.trim().toUpperCase();
    const openOts = state.workOrders.filter(o=>o.status==='Abierta' && o.otNumber!=null);
    const filtered = t? openOts.filter(o=> (o.plate||'').toUpperCase().includes(t)) : openOts;
    otList.innerHTML = [...new Set(filtered.map(o=>o.otNumber))].map(n=>`<option value="${n}">`).join('');
  };
  const refresh = (preselectId)=>{
    const ot = state.workOrders.find(o=>String(o.otNumber)===otInput.value.trim() && o.status==='Abierta');
    if(ot){ buildJobs(ot, preselectId); jobSelect.disabled = false; ccInput.value = ot.plate; ccInput.disabled = true; }
    else { buildJobs(null); jobSelect.disabled = true; ccInput.disabled = false; }
  };
  refresh(jobSelect.dataset.initial || '');
  refreshOtList();
  ccInput.addEventListener('input', ()=>{ if(!ccInput.disabled) refreshOtList(); });
  otInput.addEventListener('input', ()=> refresh(''));
}
// Muestra/oculta Centro de Costo/OT según si el ítem quedó vinculado a un
// neumático en reencauche (ver tireBlock en poItemFormBody) — mutuamente

// Al cambiar Producto/Servicio se re-arma todo el cuerpo del formulario
// (cambia qué campos aplican: Código de fabricante solo existe para

async function poItemPayloadFromForm(d){
  const isService = d.itemType==='SERVICIO';
  if(!d.productName){ alert(`Selecciona un ${isService?'servicio':'producto'} del catálogo.`); return null; }
  const list = isService? state.services : state.products;
  const match = isService? list.find(x=>x.name===d.productName) : findProductByLabel(d.productName);
  if(!match && !isService && productNameIsAmbiguous(d.productName)){ alert('Hay varios productos con ese nombre — elige uno de la lista (con su marca / cód. fabricante).'); return null; }
  if(!match){ alert(`Ese ${isService?'servicio':'producto'} ya no existe en el catálogo. Actualiza la página e intenta de nuevo.`); return null; }
  // Enlace opcional a un neumático en Reencauche (solo Servicio): el costo
  // se atribuye vía ese neumático (tireSpendEvents), no por Centro de Costo,
  // así que en ese caso Centro de Costo/OT quedan null a propósito — evita
  // contar el mismo gasto dos veces (ver computeMaintenanceCostByCC).
  let tireId = null;
  if(isService && d.tireId){
    const tire = state.tires.find(t=>t.id===d.tireId);
    if(!tire){ alert('Ese neumático ya no existe. Actualiza la página e intenta de nuevo.'); return null; }
    tireId = tire.id;
  }
  // Un servicio no pasa por almacén/Orden Logística, así que su centro de
  // costo hay que capturarlo aquí mismo o se pierde — por eso es obligatorio,
  // salvo que ya esté vinculado a un neumático (ver arriba). Un producto
  // tiene Centro de Costo opcional: vacío = ingresa a Almacén y sale después
  // a un centro de costo vía Orden Logística; definido = se carga directo
  // ahí (ver el "continue" por costCenter en el registro/borrado de
  // Comprobante de Pago, que por eso no le suma/resta stock).
  if(isService && !tireId && !d.costCenter){ alert('Indica el centro de costo del servicio.'); return null; }
  const costCenter = tireId? null : canonicalCostCenter(d.costCenter);
  if(costCenter) await ensureCatalogValue('centro_costo', costCenter);
  // Enlace opcional a una OT (y, dentro de ella, a un trabajo específico) para
  // que este ítem cargue su costo a esa OT en cuanto tenga comprobante.
  let workOrderNumber = null, workOrderItemId = null;
  if(!tireId && d.workOrderNumber){
    const otChk = safeInt(d.workOrderNumber);
    if(!otChk.ok){ alert('El N° de Orden de Trabajo ingresado es inválido.'); return null; }
    const linkedOt = otChk.value!=null? state.workOrders.find(o=>Number(o.otNumber)===otChk.value) : null;
    if(otChk.value!=null && (!linkedOt || linkedOt.status!=='Abierta')){ alert('Esa Orden de Trabajo no existe o no está abierta.'); return null; }
    workOrderNumber = otChk.value;
    if(d.workOrderItemId){
      const job = state.workOrderItems.find(i=>i.id===d.workOrderItemId && i.workOrderId===linkedOt.id);
      if(!job){ alert('Ese trabajo ya no pertenece a la OT indicada. Actualiza la página e intenta de nuevo.'); return null; }
      workOrderItemId = d.workOrderItemId;
    }
  }
  const quantity = Number(d.quantity)||0;
  const unitCost = Number(d.unitCost)||0;
  return {
    itemType: isService? 'SERVICIO' : 'PRODUCTO',
    productId: isService? null : match.id, serviceId: isService? match.id : null,
    code: match.code||null, oemCode: isService? null : (match.oemCode||null), productName: match.name,
    unit: match.unit||null, costCenter,
    workOrderNumber, workOrderItemId, tireId,
    quantity, unitCost, subtotal: Number((quantity*unitCost).toFixed(2))
  };
}
function computePoItemsSubtotal(po){
  return state.purchaseOrderItems.filter(i=>i.purchaseOrderId===po.id).reduce((a,i)=>a+Number(i.subtotal||0),0);
}
// Boleta, Ticket y Recibo por Honorarios no están afectos a IGV en Perú
// (RxH es por servicios de un independiente, exonerado; Boleta/Ticket acá
// se tratan igual por pedido del usuario) — el IGV de la OC pasa a 0%
// automáticamente sin importar el checkbox "incluye IGV".
const PO_IGV_EXEMPT_VOUCHER_TYPES = ['BOLETA','TICKET','RECIBO POR HONORARIOS'];
function poIsIgvExempt(po){ return PO_IGV_EXEMPT_VOUCHER_TYPES.includes((po.voucherType||'').trim().toUpperCase()); }
function computePoCostBreakdown(po){
  const enteredSum = computePoItemsSubtotal(po);
  const includesIgv = po.includesIgv!==false;
  if(poIsIgvExempt(po)) return {subtotal: enteredSum, igv: 0, total: enteredSum, includesIgv};
  let subtotal, igv, total;
  if(includesIgv){
    // Los precios de los ítems ya incluyen IGV: lo digitado es el TOTAL.
    // El IGV es 18% del SUBTOTAL, no del total, así que para despejarlo
    // hay que dividir entre 1.18. Ej. total 1180 → subtotal 1000 → IGV 180.
    total = enteredSum;
    subtotal = Number((enteredSum/1.18).toFixed(2));
    igv = Number((total-subtotal).toFixed(2));
  } else {
    // Los precios no incluyen IGV: lo digitado es el SUBTOTAL, se suma 18%.
    // Ej. subtotal 1000 → IGV 180 → total 1180.
    subtotal = enteredSum;
    igv = Number((enteredSum*0.18).toFixed(2));
    total = Number((enteredSum+igv).toFixed(2));
  }
  return {subtotal, igv, total, includesIgv};
}
function computePoTotal(po){
  return computePoCostBreakdown(po).total;
}
// Proveedores / Productos / Servicios se quedan arriba a la derecha (barra
// superior) en TODAS las pestañas de Logística — OL, OC, Comprobantes,
// Inventario, Consultas y sus detalles —, aunque cada pantalla escriba sus
// propios botones ahí. Sus pantallas de gestión viven dentro de la pestaña
// Orden de Compra, así que desde otra pestaña el botón primero cambia a esa.
const LOG_MASTERS = [['suppliersManaging','Proveedores'],['productsManaging','Productos'],['servicesManaging','Servicios']];
function syncLogisticaTopbar(){
  const bar = document.getElementById('topbar-actions');
  if(!bar || state.view!=='compras' || bar.querySelector('[data-log-master]')) return;
  if(!(canWrite() && canAccessSubTab('compras','oc'))) return;
  bar.insertAdjacentHTML('afterbegin', LOG_MASTERS.map(([flag,label])=>
    `<button class="btn ${filters.logisticaTab==='oc' && filters[flag]?'btn-primary':''}" data-log-master="${flag}">${label}</button>`).join(''));
  bar.querySelectorAll('[data-log-master]').forEach(b=>{
    b.addEventListener('click', ()=>{
      LOG_MASTERS.forEach(([flag])=>{ filters[flag] = (flag===b.dataset.logMaster); });
      filters.poDetailId = null;
      filters.logisticaTab = 'oc';
      renderCompras();
    });
  });
}
let logisticaTopbarObserver = null;
function observeLogisticaTopbar(){
  if(logisticaTopbarObserver) logisticaTopbarObserver.disconnect();
  const bar = document.getElementById('topbar-actions');
  if(!bar) return;
  logisticaTopbarObserver = new MutationObserver(syncLogisticaTopbar);
  logisticaTopbarObserver.observe(bar, {childList:true});
}

// Detalle de compras (ítem por ítem) de un Centro de Costo — misma fuente
// real que computeMaintenanceCostByCC (OC con Comprobante + OL Despachado),
// pero sin agregar: una fila por ítem, para poder ver/exportar el detalle.
function costCenterDetailRows(cc, from, to){
  const ccUpper = (cc||'').trim().toUpperCase();
  if(!ccUpper) return [];
  const inRangeLocal = (d)=>{
    if(from && new Date(d) < new Date(from)) return false;
    if(to && new Date(d) > new Date(to)) return false;
    return true;
  };
  const rows = [];
  state.purchaseOrderItems.forEach(i=>{
    if((i.costCenter||'').trim().toUpperCase()!==ccUpper) return;
    if(isFuelPoItem(i)) return;
    const po = state.purchaseOrders.find(p=>p.id===i.purchaseOrderId);
    if(!po || !po.locked) return;
    const link = state.paymentVoucherOrders.find(l=>l.purchaseOrderId===po.id);
    const voucher = link? state.paymentVouchers.find(v=>v.id===link.paymentVoucherId) : null;
    const date = voucher? voucher.issueDate : po.orderDate;
    if(!inRangeLocal(date)) return;
    const total = poItemPenTotal(i);
    if(total==null) return;
    const qty = Number(i.quantity||0);
    rows.push({_date:date, Fecha:fmtDate(date), 'N° Orden':`OC ${po.poNumber}`, Detalle:i.productName, Tipo: i.itemType==='SERVICIO'?'Servicio':'Producto', Cantidad: qty, 'Costo Unit. (S/)': (qty? (total/qty).toFixed(2) : total.toFixed(2)), 'Total (S/)': total.toFixed(2)});
  });
  state.logisticsOrderItems.forEach(li=>{
    if((li.costCenter||'').trim().toUpperCase()!==ccUpper) return;
    if(li.status!=='Despachado') return;
    if(!inRangeLocal(li.dispatchedAt)) return;
    const lo = state.logisticsOrders.find(o=>o.id===li.logisticsOrderId);
    const qty = Number(li.quantity||0);
    const unitCost = Number(li.unitCost||0);
    rows.push({_date:li.dispatchedAt, Fecha:fmtDate(li.dispatchedAt), 'N° Orden':`OL ${lo?lo.loNumber:'—'}`, Detalle:li.description, Tipo:'Producto', Cantidad: qty, 'Costo Unit. (S/)': unitCost.toFixed(2), 'Total (S/)': (qty*unitCost).toFixed(2)});
  });
  return rows.sort((a,b)=> new Date(a._date) - new Date(b._date)).map(({_date, ...r})=>r);
}
function renderLogisticaConsultas(){
  const rows = costCenterDetailRows(filters.ccQueryCC, filters.ccQueryFrom, filters.ccQueryTo);

  const cols = ['Fecha','N° Orden','Detalle','Tipo','Cantidad','Costo Unit. (S/)','Total (S/)'];
  let sortedRows = rows;
  if(sortState){
    const dir = sortState.dir==='asc'? 1 : -1;
    sortedRows = [...rows].sort((a,b)=>{
      const av=a[sortState.key], bv=b[sortState.key];
      const an=Number(av), bn=Number(bv);
      const bothNumeric = av!==''&&bv!==''&&!isNaN(an)&&!isNaN(bn);
      if(bothNumeric) return (an-bn)*dir;
      return String(av).localeCompare(String(bv),'es',{numeric:true})*dir;

  document.getElementById('logistica-subview').innerHTML = `
    <div class="card">

        <div><label>Hasta</label><input id="cc-query-to" type="date" value="${filters.ccQueryTo||''}"></div>
      </div>
      ${filters.ccQueryCC? `
      <div class="grid kpi-row"><div class="kpi"><div class="label">Total del periodo</div><div class="value">${fmtMoney(grandTotal).replace('S/ ','')}</div></div></div>
      <div style="margin-bottom:10px;"><button class="btn btn-sm" id="cc-query-export">Exportar Excel</button></div>
      <div class="table-scroll"><table><thead><tr>${cols.map(c=>{
        const active = sortState && sortState.key===c;
        const arrow = active? (sortState.dir==='asc'? ' ▲':' ▼') : '';
        return `<th class="sortable-th" data-cc-sort-key="${c}">${c}${arrow}</th>`;
      }).join('')}</tr></thead>
      <tbody>${sortedRows.map(r=>`<tr>${cols.map(c=>`<td class="mono">${r[c]}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}"><div class="empty">Sin compras para este centro de costo en el rango seleccionado.</div></td></tr>`}</tbody>
      ${rows.length? `<tfoot><tr style="font-weight:600;border-top:2px solid var(--line-strong,#ccc);"><td class="mono" colspan="${cols.length-1}">TOTAL</td><td class="mono">${grandTotal.toFixed(2)}</td></tr></tfoot>` : ''}
      </table></div>` : `<div class="empty">Indica un centro de costo para ver el detalle.</div>`}
    </div>
  `;
  wireFilterBar([
    {id:'cc-query-cc', key:'ccQueryCC'}, {id:'cc-query-from', key:'ccQueryFrom'}, {id:'cc-query-to', key:'ccQueryTo'}
  ], renderLogisticaConsultas);
  document.querySelectorAll('[data-cc-sort-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.ccSortKey;
      if(filters.ccQuerySort && filters.ccQuerySort.key===key){ filters.ccQuerySort.dir = filters.ccQuerySort.dir==='asc'?'desc':'asc'; }
      else { filters.ccQuerySort = {key, dir:'asc'}; }
      renderLogisticaConsultas();
    });
  });
  const exportBtn = document.getElementById('cc-query-export');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    if(rows.length===0){ alert('No hay datos para exportar con estos filtros.'); return; }
    const ws = XLSX.utils.json_to_sheet(sortedRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Centro de Costo');
    XLSX.writeFile(wb, `traza-gasto-cc-${filters.ccQueryCC.trim().toUpperCase()}-${todayLocal()}.xlsx`);

// El RUC es la clave para no duplicar proveedores en importaciones sucesivas
// (a diferencia del alta manual, que permite guardar un proveedor solo con
// nombre). Una fila sin RUC de 11 dígitos válidos se omite del import.
async function handleSupplierImportFile(file){
  const raw = await readExcelRows(file);
  if(!raw) return;

  const byRuc = new Map(); let skipped = 0;
  raw.forEach(r=>{
    const mapped = {};
    Object.keys(r).forEach(h=>{
      const field = SUPPLIER_HEADER_MAP[normalizeHeader(h)];
      if(field) mapped[field] = r[h];
    });
    const ruc = (mapped.ruc||'').toString().trim();
    if(!/^\d{11}$/.test(ruc)){ skipped++; return; }
    byRuc.set(ruc, {
      ruc, name: mapped.name? String(mapped.name).trim().toUpperCase() : null,
      address: mapped.address? String(mapped.address).trim() : null,
      contact: mapped.contact? String(mapped.contact).trim() : null,
      phone: mapped.phone? String(mapped.phone).trim() : null
    });
  });
  const rows = [...byRuc.values()];
  if(rows.length===0){ alert('Ninguna fila tenía un RUC válido de 11 dígitos — no se importó nada.'); return; }

  const existingByRuc = new Map(state.suppliers.filter(s=>s.ruc).map(s=>[s.ruc, s]));
  const toCreate = rows.filter(r=>!existingByRuc.has(r.ruc));
  const toUpdate = rows.filter(r=>existingByRuc.has(r.ruc));
  const proceed = confirm(
    `Se leyeron ${rows.length} fila(s) con RUC válido` + (skipped? ` (${skipped} fila(s) sin RUC válido se omitieron)`:'') + `.\n\n` +
    `${toCreate.length} proveedor(es) nuevo(s) se crearán.\n${toUpdate.length} proveedor(es) ya existente(s) (mismo RUC) se actualizarán con estos datos.\n\n` +
    `¿Confirmar importación?`
  );
  if(!proceed) return;

  if(toCreate.length){
    const {data:created, error} = await sb.from('suppliers').insert(toCreate.map(r=>toSnake(normalizeUppercaseAccents(r)))).select();
    if(error){ alert('Error al crear proveedores: '+error.message); return; }
    state.suppliers.push(...created.map(toCamel));
  }
  for(const row of toUpdate){
    const existing = existingByRuc.get(row.ruc);
    const updated = await dbUpdate('suppliers', existing.id, row);
    if(updated) Object.assign(existing, updated);
  }
  renderView();
  alert(`Importación completa: ${toCreate.length} proveedor(es) nuevo(s), ${toUpdate.length} actualizado(s).`);
}

// Taxonomía fija del catálogo de Productos (Tipo -> Categoría -> Subcategoría),
// entregada por la empresa. ADMINISTRATIVO se queda en 2 niveles a propósito
// (sus categorías no tienen subcategorías todavía); OPERATIVO sí tiene las 3.
const PRODUCT_TAXONOMY = {
  'ADMINISTRATIVO': {
    'ALIMENTOS Y BEBIDAS': [], 'COMPUTO': [], 'EQUIPOS Y ARTEFACTOS': [], 'IMPRESOS Y FORMATOS': [],
    'MENAJE': [], 'MUEBLES Y ENSERES': [], 'SERVICIOS GENERALES': [], 'SERVICIOS PUBLICOS': [],
    'UNIFORMES DEL PERSONAL': [], 'UTILES DE ESCRITORIO': [], 'UTILES DE LIMPIEZA': [], 'UTILES DE SEGURIDAD': []
  },
  'OPERATIVO': {
    'AIRE': [], 'AIRE ACONDICIONADO': [],
    'CARROCERIA': ['ESTRUCTURA','LAVADO Y LIMPIEZA','LUNAS Y VIDRIOS','PERFILES Y ACCESORIOS','PINTURAS','SANITARIOS','TAPICERIA'],
    'COMBUSTIBLE': [], 'CORONA': [], 'DIRECCION': [],
    'ELECTRICO': ['AUDIO Y VIDEO','ELECTRICIDAD','GPS'],
    'EMBRAGUE': [], 'FRENOS': [], 'HERRAMIENTAS': [], 'MOTOR': [], 'PINTURA': [],
    'REFRIGERACION': [], 'RETARDER': [], 'RUEDAS': [],
    'SUSPENSION': [], 'TRANSMISION': [], 'NEUMATICOS': [], 'VARIOS': []
  }
};
// Productos con categoría COMBUSTIBLE (Diesel, Gasolina, GLP, GNV — no
// repuestos del sistema de combustible, esos van en su categoría normal,
// p.ej. MOTOR) quedan fuera de las sumas de costo real por Centro de
// Costo/Vehículo/módulo Costos (ver isFuelPoItem) — ese gasto YA está
// contado ahí por Combustible (fuelTotal, por vale/tanqueo); contar también
// la OC/Comprobante lo duplicaría. La OC y su Comprobante siguen existiendo
// normalmente para cuentas por pagar/IGV, solo no suman ahí.
function isFuelPoItem(item){
  const list = item.itemType==='SERVICIO'? state.services : state.products;
  const idField = item.itemType==='SERVICIO'? 'serviceId' : 'productId';
  const match = (item[idField]? list.find(x=>x.id===item[idField]) : null)
    || (item.code? list.find(x=>x.code===item.code) : null)
    || list.find(x=>x.name && item.productName && x.name.trim().toUpperCase()===item.productName.trim().toUpperCase());
  return !!(match && match.category==='COMBUSTIBLE');
}
// Árbol de Servicios: comparte Tipo y Categoría con Productos (mismas 28

function wireProductTaxonomy(p){
  p = p||{};
  const typeSelect = document.getElementById('prod-type-select');
  const catSelect = document.getElementById('prod-category-select');
  const subSelect = document.getElementById('prod-subcategory-select');
  if(!typeSelect||!catSelect||!subSelect) return;
  function fillCategory(selected){
    const options = productCategoryOptions(typeSelect.value);
    catSelect.innerHTML = '<option value="">—</option>' + options.map(c=>`<option value="${c}" ${selected===c?'selected':''}>${c}</option>`).join('');
  }
  function fillSubcategory(selected){

    subSelect.innerHTML = '<option value="">—</option>' + options.map(s=>`<option value="${s}" ${selected===s?'selected':''}>${s}</option>`).join('');
    subSelect.disabled = options.length===0;
  }
  fillCategory(p.category);
  fillSubcategory(p.subcategory);
  typeSelect.addEventListener('change', ()=>{ fillCategory(null); fillSubcategory(null); });
  catSelect.addEventListener('change', ()=>{ fillSubcategory(null); });
}
async function productPayloadFromForm(d, codeForNew, excludeId){
  if(!d.name){ alert('Indica el nombre del producto.'); return null; }
  const dupKey = productIdentityKey(d.name, d.brand, d.oemCode);
  const dup = state.products.find(p=>p.id!==excludeId && productIdentityKey(p.name, p.brand, p.oemCode)===dupKey);
  if(dup){ alert(`Ya existe un producto con el mismo nombre, marca y código de fabricante (Cód. ${dup.code||'—'}). Para tener el mismo nombre debe cambiar la marca o el código de fabricante.`); return null; }
  if(d.unit) await ensureCatalogValue('unidad_medida', d.unit.trim());
  if(d.brand) await ensureCatalogValue('marca', d.brand.trim());
  const payload = {
    name: d.name.trim(), oemCode: d.oemCode||null, unit: d.unit? d.unit.trim().toUpperCase():null,
    brand: d.brand? d.brand.trim().toUpperCase() : null,
    productType: d.productType||null, category: d.category||null, subcategory: d.subcategory||null,
    stock: d.stock!=null && d.stock!==''? Number(d.stock) : 0,
    minStock: d.minStock!=null && d.minStock!==''? Number(d.minStock) : 0,
    cost: d.cost!=null && d.cost!==''? Number(d.cost) : 0
  };
  if(codeForNew) payload.code = codeForNew;
  return payload;
}

// Exporta el maestro actual (código, nombre, unidad y clasificación) para que
// se llenen/corrijan Tipo/Categoría/Subcategoría en Excel y se reimporte con
// handleProductImportFile — no incluye stock/costo porque esos cambian por
// otros flujos (despachos, comprobantes) y reimportar un export viejo los
// dejaría desactualizados.
function exportProductsExcel(rows){
  const data = rows.map(p=>({'Código':p.code||'', 'Código Fabricante':p.oemCode||'', 'Nombre':p.name||'', 'Marca':p.brand||'', 'Unidad':p.unit||'', 'Tipo':p.productType||'', 'Categoría':p.category||'', 'Subcategoría':p.subcategory||''}));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Productos');
  XLSX.writeFile(wb, `traza-productos-${todayLocal()}.xlsx`);
}
// La clave para no duplicar es Nombre + Marca + Código de fabricante (mismo
// criterio que products_identity_key en BD): el mismo nombre puede repetirse
// si cambia la marca o el código de fabricante. El código interno no se
// importa nunca — es autogenerado y secuencial, tocarlo desde Excel podría
// romper la secuencia o chocar con otro producto.
async function handleProductImportFile(file){
  const raw = await readExcelRows(file);
  if(!raw) return;

  const byName = new Map(); let skipped = 0, invalidTaxonomy = 0;
  raw.forEach(r=>{
    const mapped = {};
    Object.keys(r).forEach(h=>{
      const field = PRODUCT_HEADER_MAP[normalizeHeader(h)];
      if(field) mapped[field] = r[h];
    });
    const name = (mapped.name||'').toString().trim();
    if(!name){ skipped++; return; }
    const row = { name, oemCode: mapped.oemCode? String(mapped.oemCode).trim() : null, brand: mapped.brand? String(mapped.brand).trim().toUpperCase() : null, unit: mapped.unit? String(mapped.unit).trim().toUpperCase() : null };
    const productType = mapped.productType? String(mapped.productType).trim().toUpperCase() : '';
    const category = mapped.category? String(mapped.category).trim().toUpperCase() : '';
    const subcategory = mapped.subcategory? String(mapped.subcategory).trim().toUpperCase() : '';
    row.productType = PRODUCT_TAXONOMY[productType]? productType : null;
    row.category = row.productType && productCategoryOptions(row.productType).includes(category) ? category : null;
    row.subcategory = row.category && productSubcategoryOptions(row.productType, row.category).includes(subcategory) ? subcategory : null;
    if((productType && !row.productType) || (category && !row.category) || (subcategory && !row.subcategory)) invalidTaxonomy++;
    byName.set(productIdentityKey(row.name, row.brand, row.oemCode), row);
  });
  const rows = [...byName.values()];
  if(rows.length===0){ alert('Ninguna fila tenía Nombre completo — no se importó nada.'); return; }

  const existingByName = new Map(state.products.filter(p=>p.name).map(p=>[productIdentityKey(p.name, p.brand, p.oemCode), p]));
  const toUpdate = rows.filter(r=>existingByName.has(productIdentityKey(r.name, r.brand, r.oemCode)));
  const toCreate = rows.filter(r=>!existingByName.has(productIdentityKey(r.name, r.brand, r.oemCode)));
  const proceed = confirm(
    `Se leyeron ${rows.length} fila(s) con nombre` + (skipped? ` (${skipped} fila(s) sin nombre se omitieron)`:'') + `.\n\n` +
    `${toCreate.length} producto(s) nuevo(s) se crearán.\n${toUpdate.length} producto(s) ya existente(s) (mismo nombre, marca y código de fabricante) se actualizarán.\n` +
    (invalidTaxonomy? `${invalidTaxonomy} fila(s) traían Tipo/Categoría/Subcategoría que no calzan con la taxonomía y se dejarán en blanco.\n` : '') +
    `\n¿Confirmar importación?`
  );
  if(!proceed) return;

  for(const row of toUpdate){
    const existing = existingByName.get(productIdentityKey(row.name, row.brand, row.oemCode));
    const updated = await dbUpdate('products', existing.id, row);
    if(updated) Object.assign(existing, updated);
  }
  for(const row of toCreate){
    const created = await dbInsert('products', {...row, code: computeNextProductCode(), stock:0, minStock:0, cost:0});
    if(created) state.products.push(created);
  }
  renderView();
  alert(`Importación completa: ${toCreate.length} producto(s) nuevo(s), ${toUpdate.length} actualizado(s).`);
}

// ---- Servicios: maestro paralelo a Productos, para ítems de Orden de
// Compra que no pasan por almacén (mano de obra de terceros, inspecciones,
// etc.). Sin stock/stock mínimo — no aplica a un servicio. ----
function computeNextServiceCode(){
  const nums = state.services.map(s=> parseInt(s.code,10)).filter(n=>!isNaN(n));
  const next = (nums.length? Math.max(...nums) : 0) + 1;
  return String(next).padStart(6,'0');
}

const PO_LIST_COLUMNS = [
  {key:'poNumber', label:'N° Orden'}, {key:'supplierDisplay', label:'Proveedor'},
  {key:'voucherType', label:'Comprobante'}, {key:'voucherNumberDisplay', label:'N° Comprobante'},
  {key:'deliveryDate', label:'Fecha entrega'}, {key:'shipTo', label:'Enviar a'}, {key:'total', label:'Total'}
];
function sortGenericRows(rows, sortState, defaultKey, defaultDir, accessor){
  const {key, dir} = sortState || {key:defaultKey, dir:defaultDir||'asc'};
  const factor = dir==='asc'? 1 : -1;
  const getVal = accessor || ((row,k)=>row[k]);
  return [...rows].sort((a,b)=>{
    let av = getVal(a,key), bv = getVal(b,key);
    const aEmpty = (av===null||av===undefined||av==='');
    const bEmpty = (bv===null||bv===undefined||bv==='');
    if(aEmpty && bEmpty) return 0;
    if(aEmpty) return 1;
    if(bEmpty) return -1;
    const bothNumeric = !isNaN(av) && !isNaN(bv);
    if(bothNumeric) return (Number(av)-Number(bv))*factor;
    return String(av).localeCompare(String(bv), 'es', {numeric:true, sensitivity:'base'})*factor;
  });
}

// Convierte un monto a su expresión en letras (formato peruano de
// comprobantes: "SON: <MONTO> CON XX/100 SOLES", sin el "CON.../100" si
// no hay céntimos). Usado en la impresión de Orden de Compra.
function numberToWordsEs(n){
  n = Math.floor(n);
  if(n===0) return 'CERO';
  const UNIDADES = ['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE'];
  const ESPECIALES = {10:'DIEZ',11:'ONCE',12:'DOCE',13:'TRECE',14:'CATORCE',15:'QUINCE',16:'DIECISÉIS',17:'DIECISIETE',18:'DIECIOCHO',19:'DIECINUEVE',
    20:'VEINTE',21:'VEINTIUNO',22:'VEINTIDÓS',23:'VEINTITRÉS',24:'VEINTICUATRO',25:'VEINTICINCO',26:'VEINTISÉIS',27:'VEINTISIETE',28:'VEINTIOCHO',29:'VEINTINUEVE'};
  const DECENAS = {30:'TREINTA',40:'CUARENTA',50:'CINCUENTA',60:'SESENTA',70:'SETENTA',80:'OCHENTA',90:'NOVENTA'};
  const CENTENAS = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const dosDigitos = (num)=>{
    if(num<=29) return ESPECIALES[num] || UNIDADES[num];
    const d = Math.floor(num/10)*10, u = num%10;
    return u? `${DECENAS[d]} Y ${UNIDADES[u]}` : DECENAS[d];
  };
  const tresDigitos = (num)=>{
    if(num===0) return '';
    if(num===100) return 'CIEN';
    const c = Math.floor(num/100), resto = num%100;
    let r = c? CENTENAS[c] : '';
    if(resto) r += (r?' ':'')+dosDigitos(resto);
    return r;
  };
  const millones = Math.floor(n/1000000);
  const miles = Math.floor((n%1000000)/1000);
  const cientos = n%1000;
  const partes = [];
  if(millones) partes.push(millones===1? 'UN MILLÓN' : `${tresDigitos(millones)} MILLONES`);
  if(miles) partes.push(miles===1? 'MIL' : `${tresDigitos(miles)} MIL`);
  if(cientos) partes.push(tresDigitos(cientos));
  return partes.filter(Boolean).join(' ').trim();
}
function amountToWordsEs(amount, currencyLabel){
  const n = Math.round(Number(amount||0)*100)/100;
  const intPart = Math.floor(n);
  const cents = Math.round((n-intPart)*100);
  const words = numberToWordsEs(intPart);
  return cents>0? `SON: ${words} CON ${String(cents).padStart(2,'0')}/100 ${currencyLabel}` : `SON: ${words} ${currencyLabel}`;
}

function printOverlay(html){
  const el = document.getElementById('print-overlay');
  el.innerHTML = html;
  document.body.classList.add('printing-overlay');
  const cleanup = ()=>{ document.body.classList.remove('printing-overlay'); el.innerHTML=''; window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  window.print();
}
function computeNextLoNumber(){
  if(state.logisticsOrders.filter(o=>o.loNumber!=null).length===0) return 1;
  return Math.max(0, ...state.logisticsOrders.map(o=>Number(o.loNumber)||0)) + 1;
}
function loItemStatusBadge(status){
  const map = {'Despachado':'badge-ok','Rechazado':'badge-crit','Pendiente':'badge-warn'};
  return `<span class="badge ${map[status]||'badge-idle'}">${status}</span>`;
}
// La descripción de un ítem de OL se guarda como el nombre del producto tal
// cual (para que el resto del código lo pueda seguir buscando por nombre,
// ver loItemPayloadFromForm) — la marca se agrega solo al mostrarlo, nunca
// al dato guardado.
function loItemDescriptionDisplay(item){
  const product = (item.productId? state.products.find(p=>p.id===item.productId) : null)
    || state.products.find(p=>p.name && item.description && p.name.trim().toUpperCase()===item.description.trim().toUpperCase());
  return product && product.brand? `${item.description} (${product.brand})` : item.description;
}
function computeLoOrderStatus(items){
  if(items.length===0) return 'Pendiente';
  if(items.some(i=>i.status==='Pendiente')) return 'Pendiente';
  if(items.every(i=>i.status==='Rechazado')) return 'Rechazado';
  return 'Entregado';
}
function computeLoStatusCounts(items){
  return {
    Pendiente: items.filter(i=>i.status==='Pendiente').length,
    Entregado: items.filter(i=>i.status==='Despachado').length,
    Rechazado: items.filter(i=>i.status==='Rechazado').length
  };
}
function loMixedStatusDisplay(counts){
  const parts = [];
  if(counts.Entregado) parts.push(`<span class="badge badge-ok">${counts.Entregado} Entregado${counts.Entregado===1?'':'s'}</span>`);
  if(counts.Pendiente) parts.push(`<span class="badge badge-warn">${counts.Pendiente} Pendiente${counts.Pendiente===1?'':'s'}</span>`);
  if(counts.Rechazado) parts.push(`<span class="badge badge-crit">${counts.Rechazado} Rechazado${counts.Rechazado===1?'':'s'}</span>`);
  return parts.join(' ') || '<span class="badge badge-idle">Sin pedidos</span>';
}
function loOrderStatusBadge(status){
  const map = {'Entregado':'badge-ok','Rechazado':'badge-crit','Pendiente':'badge-warn'};

async function loHeaderPayloadFromForm(d, loNumberForNew){
  if(!d.place){ alert('Indica el lugar.'); return null; }
  if(!canSeeLoPlace(d.place.trim().toUpperCase())){ alert('No tienes acceso a ese lugar. Lugares habilitados: '+loPlaceOptionsForCreate().join(', ')); return null; }
  if(!d.responsible){ alert('Indica el responsable.'); return null; }
  const otChk = d.workOrderNumber? safeInt(d.workOrderNumber) : {ok:true, value:null};
  if(!otChk.ok){ alert('El N° de Orden de Trabajo ingresado es inválido.'); return null; }
  const linkedOt = otChk.value!=null? state.workOrders.find(o=>Number(o.otNumber)===otChk.value) : null;
  if(otChk.value!=null && (!linkedOt || linkedOt.status!=='Abierta')){ alert('Esa Orden de Trabajo no existe o no está abierta.'); return null; }
  const plate = linkedOt? linkedOt.plate : canonicalCostCenter(d.plate);
  if(!plate){ alert('Indica el Centro de Costo.'); return null; }
  const payload = {
    place: d.place.trim().toUpperCase(), responsible: d.responsible.trim().toUpperCase(),
    area: d.area? d.area.trim().toUpperCase() : null, workOrderNumber: otChk.value,
    plate,
    priority: d.priority||'Normal'
  };
  if(loNumberForNew!=null){ payload.voided = false; }
  return payload;
}

/* ===================== COMPROBANTES DE PAGO ===================== */
function parseSerieNumero(raw){
  const s = (raw||'').trim().toUpperCase();
  if(!s) return {series:null, number:null};
  const m = s.match(/^([A-Z0-9]{1,4})-(\d{1,8})$/);
  return m? {series:m[1], number:m[2]} : null;
}
function computeMatchingPOs(term){
  if(!term) return [];
  const t = term.trim().toUpperCase();
  return state.purchaseOrders.filter(po=> po.poNumber!=null && !po.locked &&
    (((po.supplierRuc||'').toUpperCase().includes(t)) || ((po.supplierName||'').toUpperCase().includes(t)))
  ).sort((a,b)=> Number(b.poNumber)-Number(a.poNumber));
}

        <td>${pos.map(p=>`<button class="btn btn-sm" data-voucher-po-view="${p.id}">Ver OC N° ${p.poNumber}</button>`).join(' ')||'—'}</td>
        ${canWrite()?`<td><button class="btn btn-sm" data-voucher-edit="${v.id}">Editar</button> <button class="btn btn-sm btn-danger" data-voucher-del="${v.id}">Eliminar</button></td>`:''}
      </tr>`).join('') || `<tr><td colspan="${canWrite()?9:8}"><div class="empty">Todavía no hay comprobantes que calcen con estos filtros.</div></td></tr>`}</tbody></table></div>
    </div>
  `;
  document.querySelectorAll('[data-voucher-sort-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.voucherSortKey;
      if(filters.voucherSort && filters.voucherSort.key===key){ filters.voucherSort.dir = filters.voucherSort.dir==='asc'?'desc':'asc'; }
      else { filters.voucherSort = {key, dir:'asc'}; }
      renderComprobantesPago();
    });
  });
  document.querySelectorAll('[data-voucher-po-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      filters.logisticaTab = 'oc';
      filters.poDetailId = btn.dataset.voucherPoView;
      renderCompras();
    });
  });
  if(canWrite()){
    document.querySelectorAll('[data-voucher-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const v = state.paymentVouchers.find(x=>x.id===btn.dataset.voucherEdit);
        openModal(`Editar comprobante — ${v.voucherSeries||''}-${v.voucherNumber||''}`, voucherEditFormBody(v), async (d)=>{
          const patch = voucherEditPayloadFromForm(d, v); if(!patch) return;
          const updated = await dbUpdate('payment_vouchers', v.id, patch);
          if(updated){ Object.assign(v, updated); await ensureCatalogValue('comprobante_pago', patch.voucherType); closeModal(); renderView(); }
        }, 'Guardar cambios');
        wireVoucherEditDueDate(v);
      });
    });
    document.querySelectorAll('[data-voucher-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('¿Eliminar este comprobante? Las Órdenes de Compra vinculadas quedarán desbloqueadas (editables de nuevo), se revierte el stock que se sumó al registrarlo y el retorno de reencauche de neumáticos vinculados (si el neumático sigue en almacén; si ya se volvió a montar o reencauchar, no se revierte automáticamente) (el precio no se revierte, porque no se guarda cuál era el anterior). Esta acción no se puede deshacer.')) return;
        const links = state.paymentVoucherOrders.filter(l=>l.paymentVoucherId===btn.dataset.voucherDel);
        for(const link of links){
          const updated = await dbUpdate('purchase_orders', link.purchaseOrderId, {locked:false});
          if(updated){ const po = state.purchaseOrders.find(p=>p.id===link.purchaseOrderId); if(po) Object.assign(po, updated); }
          const items = state.purchaseOrderItems.filter(i=>i.purchaseOrderId===link.purchaseOrderId);
          for(const item of items){
            if(item.itemType==='SERVICIO' && item.tireId){ await revertTireRetreadFromPoItem(item); continue; }
            if(item.itemType==='SERVICIO' || item.costCenter) continue; // no manejan stock: servicios, y productos con centro de costo directo
            const product = (item.productId? state.products.find(p=>p.id===item.productId) : null)
              || (item.code? state.products.find(p=>p.code===item.code) : null)
              || state.products.find(p=>p.name.trim().toUpperCase()===(item.productName||'').trim().toUpperCase());
            if(!product) continue;
            const newStock = Number(product.stock||0) - Number(item.quantity||0);
            const updatedProduct = await dbUpdate('products', product.id, {stock:newStock});
            if(updatedProduct) Object.assign(product, updatedProduct);
          }
        }
        const {error} = await sb.from('payment_vouchers').delete().eq('id', btn.dataset.voucherDel);
        if(error){ alert('No se pudo eliminar: '+error.message); return; }
        state.paymentVouchers = state.paymentVouchers.filter(x=>x.id!==btn.dataset.voucherDel);
        state.paymentVoucherOrders = state.paymentVoucherOrders.filter(x=>x.paymentVoucherId!==btn.dataset.voucherDel);
        renderView();
      });
    });
  }
  wireFilterBar([
    {id:'voucher-search-number', key:'voucherSearchNumber'}, {id:'voucher-search-supplier', key:'voucherSearchSupplier'}
  ], renderComprobantesPago);
}
function renderVoucherCreate(){
  document.getElementById('topbar-actions').innerHTML = `<button class="btn" id="btn-voucher-cancel">← Cancelar</button>`;
  document.getElementById('btn-voucher-cancel').addEventListener('click', ()=>{ filters.voucherCreating=false; renderCompras(); });
  const matches = computeMatchingPOs(filters.voucherSearchTerm);
  const selectedIds = filters.voucherSelectedPoIds||[];
  const selectedPOs = selectedIds.map(id=>state.purchaseOrders.find(p=>p.id===id)).filter(Boolean);
  const firstPO = selectedPOs[0];
  document.getElementById('logistica-subview').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>Buscar Orden de Compra</h3><div class="hint">Ingresa el RUC o nombre del proveedor</div></div>
      <div class="form-row">
        <div><label>RUC o Proveedor</label><input id="voucher-search" type="text" value="${filters.voucherSearchTerm}" placeholder="Escribe y presiona Buscar..."></div>
        <div style="display:flex;align-items:end;"><button class="btn btn-primary" id="voucher-search-btn" style="margin-bottom:12px;">Buscar</button></div>
      </div>
      ${filters.voucherSearchTerm? `
      <div class="table-scroll"><table><thead><tr><th></th><th>N° OC</th><th>Proveedor</th><th>RUC</th><th>Fecha pedido</th><th>Total</th></tr></thead>
      <tbody>${matches.map(po=>`<tr>
        <td><input type="checkbox" class="voucher-po-check" data-po-id="${po.id}" ${selectedIds.includes(po.id)?'checked':''}></td>
        <td class="mono">${po.poNumber}</td><td>${po.supplierName||'—'}</td><td class="mono">${po.supplierRuc||'—'}</td>
        <td>${fmtDateDMY(po.orderDate)}</td><td>${fmtMoney(computePoTotal(po))}</td>
      </tr>`).join('') || `<tr><td colspan="6"><div class="empty">No se encontraron órdenes de compra disponibles (no bloqueadas) para ese proveedor.</div></td></tr>`}</tbody></table></div>
      ` : ''}
    </div>
    ${selectedPOs.length? `
    <div class="card">
      <div class="card-head"><h3>Datos del comprobante</h3><div class="hint">${selectedPOs.length} orden(es) de compra: ${selectedPOs.map(p=>'N° '+p.poNumber).join(', ')}</div></div>
      <div class="form-row three">
        <div><label>Comprobante</label><input id="voucher-type" type="text" list="voucher-type-list" placeholder="Factura, Boleta..." value="FACTURA"><datalist id="voucher-type-list">${catalogValues('comprobante_pago').map(c=>`<option value="${c}">`).join('')}</datalist></div>
        <div><label>Forma de Pago</label><input type="text" value="${firstPO.paymentMethod||'—'}" disabled style="background:var(--bg);"></div>
        <div><label>Días de Crédito</label><input type="text" value="${firstPO.creditDays!=null?firstPO.creditDays:'—'}" disabled style="background:var(--bg);"></div>
      </div>
      <div class="form-row">
        <div><label>Moneda</label><input type="text" value="${firstPO.currency||'—'}" disabled style="background:var(--bg);"></div>
        <div></div>
      </div>
      <div class="form-row">
        <div><label>N° de Comprobante</label><input id="voucher-combined" type="text" placeholder="Ej. F001-123456"></div>
        <div><label>N° de Guía (opcional)</label><input id="guide-combined" type="text" placeholder="Ej. T001-654321"></div>
      </div>
      <div class="form-row">
        <div><label>Fecha de emisión</label><input id="voucher-issue-date" type="date" value="${todayLocal()}"></div>
        <div><label>Fecha de vencimiento</label><input id="voucher-due-date" type="date" ${firstPO.paymentMethod!=='Crédito'?'disabled':''}></div>
      </div>
      <button class="btn btn-primary" id="voucher-save-btn">Guardar comprobante</button>
    </div>
    ` : ''}
  `;
  document.getElementById('voucher-search-btn').addEventListener('click', ()=>{
    filters.voucherSearchTerm = document.getElementById('voucher-search').value;
    renderVoucherCreate();
  });
  document.querySelectorAll('.voucher-po-check').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const id = chk.dataset.poId;
      if(chk.checked){ if(!filters.voucherSelectedPoIds.includes(id)) filters.voucherSelectedPoIds.push(id); }
      else { filters.voucherSelectedPoIds = filters.voucherSelectedPoIds.filter(x=>x!==id); }
      renderVoucherCreate();
    });
  });
  if(selectedPOs.length){
    const issueDateInput = document.getElementById('voucher-issue-date');
    const dueDateInput = document.getElementById('voucher-due-date');
    const updateDueDate = ()=>{
      if(firstPO.paymentMethod==='Crédito' && firstPO.creditDays!=null && issueDateInput.value){
        const [y,m,d] = issueDateInput.value.split('-').map(Number);
        const due = new Date(y, m-1, d + Number(firstPO.creditDays));
        dueDateInput.value = localDateStr(due);
      } else {
        dueDateInput.value = '';
      }
    };
    issueDateInput.addEventListener('change', updateDueDate);
    updateDueDate();
    document.getElementById('voucher-save-btn').addEventListener('click', async ()=>{
      const voucherType = document.getElementById('voucher-type').value.trim().toUpperCase();
      if(!voucherType){ alert('Indica el tipo de comprobante.'); return; }
      const voucherParsed = parseSerieNumero(document.getElementById('voucher-combined').value);
      if(!voucherParsed || !voucherParsed.series){ alert('Indica el N° de comprobante en formato SERIE-NÚMERO (ej. F001-123456).'); return; }
      const guideParsed = parseSerieNumero(document.getElementById('guide-combined').value);
      if(!guideParsed){ alert('El N° de guía debe tener el formato SERIE-NÚMERO (ej. T001-654321), o déjalo vacío.'); return; }
      const incompleteItems = selectedPOs.flatMap(po=> state.purchaseOrderItems.filter(i=>i.purchaseOrderId===po.id)
        .filter(i=> !(Number(i.quantity)>0) || !(Number(i.unitCost)>0))
        .map(i=>`OC N° ${po.poNumber} — ${i.productName}`));
      if(incompleteItems.length){ alert('Todos los ítems de las OC seleccionadas deben tener cantidad y costo unitario mayores a 0 antes de asignar un comprobante. Faltan:\n\n'+incompleteItems.join('\n')); return; }
      const missingExchangeRate = selectedPOs.filter(po=> po.currency==='Dólares' && po.exchangeRate==null).map(po=>`OC N° ${po.poNumber}`);
      if(missingExchangeRate.length){ alert('Las OC en dólares seleccionadas necesitan su tipo de cambio (en "Editar cabecera") antes de asignarles un comprobante. Faltan:\n\n'+missingExchangeRate.join('\n')); return; }
      const issueDate = issueDateInput.value;
      const dueDate = firstPO.paymentMethod==='Crédito'? dueDateInput.value : null;
      const payload = {
        voucherType, paymentMethod: firstPO.paymentMethod, creditDays: firstPO.creditDays, currency: firstPO.currency,
        voucherSeries: voucherParsed.series, voucherNumber: voucherParsed.number, guideSeries: guideParsed.series, guideNumber: guideParsed.number,
        issueDate, dueDate
      };
      const created = await dbInsert('payment_vouchers', payload);
      if(!created) return;
      state.paymentVouchers.unshift(created);
      let productsTouched = 0;
      for(const po of selectedPOs){
        const link = await dbInsert('payment_voucher_orders', {paymentVoucherId:created.id, purchaseOrderId:po.id});
        if(link) state.paymentVoucherOrders.push(link);
        const updated = await dbUpdate('purchase_orders', po.id, {locked:true});
        if(updated) Object.assign(po, updated);
        const items = state.purchaseOrderItems.filter(i=>i.purchaseOrderId===po.id);
        for(const item of items){
          if(item.itemType==='SERVICIO' && item.tireId){ await completeTireRetreadFromPoItem(item, issueDate); continue; }
          if(item.itemType==='SERVICIO' || item.costCenter) continue; // no manejan stock: servicios, y productos con centro de costo directo
          const product = (item.productId? state.products.find(p=>p.id===item.productId) : null)
            || (item.code? state.products.find(p=>p.code===item.code) : null)
            || state.products.find(p=>p.name.trim().toUpperCase()===(item.productName||'').trim().toUpperCase());
          if(!product) continue;
          const newStock = Number(product.stock||0) + Number(item.quantity||0);
          const patch = {stock:newStock};
          if(item.unitCost!=null) patch.cost = Number(item.unitCost);
          const updatedProduct = await dbUpdate('products', product.id, patch);
          if(updatedProduct){ Object.assign(product, updatedProduct); productsTouched++; }
        }
      }
      await ensureCatalogValue('comprobante_pago', voucherType);
      filters.voucherCreating = false;
      filters.voucherSelectedPoIds = [];
      renderView();
      if(productsTouched) alert(`Comprobante registrado. Se actualizó el stock y precio de ${productsTouched} producto(s).`);
    });
  }
}

function loPriorityDisplay(priority){
  const p = priority || 'Normal';
  const color = p==='Urgente'? 'var(--crit)' : (p==='Alta'? 'var(--warn)' : 'inherit');
  return `<span style="color:${color};font-weight:${p==='Normal'?'normal':'600'};">${p}</span>`;

    const payload = await loHeaderPayloadFromForm(d, computeNextLoNumber()); if(!payload) return;

        <div style="display:flex;gap:8px;">

          <div style="flex:1;"><label>Hasta</label><input id="lo-reg-filter-to" type="date" value="${regTo||''}"></div>

    {id:'lo-reg-filter-description', key:'loRegDescription'}
  ], renderLoRegistro, 'lo-reg-filter-description');

// Almacén decide qué se entrega realmente: al despachar puede cambiar el
// producto pedido por el que sale físicamente, y el costo se toma del
// producto entregado en ese momento (no el que tenía el pedido al crearse,
// que quedaba congelado — p. ej. S/ 0 si se pidió antes del comprobante).
function loDispatchFindProduct(name){ return findProductByLabel(name); }
function loDispatchInitialProduct(item){
  return (item.productId? state.products.find(p=>p.id===item.productId) : null) || loDispatchFindProduct(item.description);
}
function loDispatchRowInfo(product, qty){
  if(!product) return '<span style="color:var(--crit);">Ese producto no existe en el catálogo.</span>';
  const cost = Number(product.cost||0);
  const stock = Number(product.stock||0);
  const warns = [];
  if(!(cost>0)) warns.push('sin costo (aún no hay comprobante) — se despachará a S/ 0.00');
  if(qty!=null && stock<Number(qty)) warns.push('stock insuficiente');
  return `Costo actual: ${fmtMoney(cost)} · Stock: ${stock}${warns.length? ` <span style="color:var(--crit);">⚠ ${warns.join(' · ')}</span>` : ''}`;
}
function openLoDispatchModal(ids){
  const items = ids.map(id=>state.logisticsOrderItems.find(x=>x.id===id)).filter(Boolean);
  if(items.length===0) return;
  const sel=(v)=> v===undefined||v===null?'':v;
  const productLabels = productLabelIndex().labelOf;
  const sortedProducts = [...state.products].sort((a,b)=>a.name.localeCompare(b.name,'es',{numeric:true}));
  const body = `
    <div class="hint" style="margin-bottom:10px;">Confirma qué producto sale realmente de Almacén. Si es distinto al pedido, cámbialo: el stock y el costo se toman del producto entregado.</div>
    ${items.map(i=>{
      const p = loDispatchInitialProduct(i);
      return `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;">
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">Pedido: <strong>${i.description}</strong> — ${i.quantity!=null?i.quantity:'—'} ${i.unit||''}</div>
        <input name="prod_${i.id}" type="text" list="lo-dispatch-product-list" value="${sel(p? productLabels(p) : i.description)}" autocomplete="off" data-dispatch-input="${i.id}">
        <div class="hint" style="margin:4px 0 0;" data-dispatch-info="${i.id}">${loDispatchRowInfo(p, i.quantity)}</div>
      </div>`;
    }).join('')}
    <datalist id="lo-dispatch-product-list">${productPickerOptions(sortedProducts, productLabels)}</datalist>`;
  openModal(`Despachar ${items.length} pedido(s)`, body, async (d)=>{
    const resolved = [];
    for(const i of items){
      const product = loDispatchFindProduct(d['prod_'+i.id]);
      if(!product){ alert(`El producto indicado para "${i.description}" no existe en el catálogo.`); return; }
      resolved.push({item:i, product, original: loDispatchInitialProduct(i)});
    }
    const noCost = resolved.filter(r=>!(Number(r.product.cost||0)>0)).map(r=>r.product.name);
    if(noCost.length && !confirm(`Estos productos no tienen costo registrado y se despacharán a S/ 0.00:\n\n${noCost.join('\n')}\n\n¿Despachar igual?`)) return;
    for(const {item, product, original} of resolved){
      const substituted = !original || original.id!==product.id;
      const patch = {
        status:'Despachado', dispatchedAt:new Date().toISOString(),
        productId: product.id, description: product.name, unit: product.unit||item.unit||null,
        unitCost: Number(product.cost||0)
      };
      if(substituted){
        const originalText = original? productLabel(original) : item.description;
        patch.observations = item.observations? `${item.observations} | Pedido original: ${originalText}` : `Pedido original: ${originalText}`;
      }
      const updated = await dbUpdate('logistics_order_items', item.id, patch);
      if(!updated) continue;
      Object.assign(item, updated);
      if(item.quantity!=null){
        const updatedProduct = await dbUpdate('products', product.id, {stock: Number(product.stock||0) - Number(item.quantity)});
        if(updatedProduct) Object.assign(product, updatedProduct);
      }
    }
    closeModal(); renderView();
  }, 'Despachar');
  document.querySelectorAll('[data-dispatch-input]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const item = items.find(x=>x.id===input.dataset.dispatchInput);
      const infoEl = document.querySelector(`[data-dispatch-info="${input.dataset.dispatchInput}"]`);
      if(item && infoEl) infoEl.innerHTML = loDispatchRowInfo(loDispatchFindProduct(input.value), item.quantity);
    });
  });
}

  document.getElementById('topbar-actions').innerHTML = '';
  // Mantenimiento: costo real por centro de costo (OC facturadas + OL
  // despachadas) — misma fuente que "Gastos por centro de costo", ya no el
  // campo manual maintenance.cost, que en la práctica casi nunca se llena.
  const maintenanceByCC = computeMaintenanceCostByCC(null, null);
  const maintTotal = Object.values(maintenanceByCC).reduce((a,v)=>a+v,0);
  const fuelTotal = state.fuelLogs.reduce((a,f)=>a+Number(f.cost),0);
  // Compras a Almacén: productos comprados SIN centro de costo (quedan en
  // stock general, todavía no atribuidos a ninguna unidad) — antes esto se
  // llamaba "Compras/repuestos" y sumaba el total bruto de TODAS las OC
  // (mezclaba soles y dólares sin convertir, y duplicaba lo ya contado en
  // Mantenimiento para los ítems que sí tienen centro de costo).
  const almacenTotal = state.purchaseOrderItems.filter(i=>i.itemType==='PRODUCTO' && !i.costCenter && !isFuelPoItem(i))
    .filter(i=>{ const po=state.purchaseOrders.find(p=>p.id===i.purchaseOrderId); return po && po.locked; })
    .reduce((a,i)=>a+(poItemPenTotal(i)||0),0);
  const tireEvents = tireSpendEvents();
  const tireTotal = tireEvents.reduce((a,e)=>a+e.cost,0);
  const grand = maintTotal+fuelTotal+almacenTotal+tireTotal || 1;
  const byVehicle = {};
  const vehiclePlates = new Set(state.vehicles.map(v=>v.plate));
  Object.entries(maintenanceByCC).forEach(([cc,amount])=>{ if(vehiclePlates.has(cc)) byVehicle[cc]=(byVehicle[cc]||0)+amount; });
  state.fuelLogs.forEach(f=>{ byVehicle[f.plate]=(byVehicle[f.plate]||0)+Number(f.cost); });
  tireEvents.forEach(e=>{ if(e.plate) byVehicle[e.plate]=(byVehicle[e.plate]||0)+e.cost; });
  const topVehicles = Object.entries(byVehicle).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxCost = topVehicles.length? topVehicles[0][1] : 1;
  document.getElementById('content').innerHTML = `
    <div class="grid kpi-row">
      <div class="kpi"><div class="label">Costo total consolidado</div><div class="value">${fmtMoney(grand).replace('S/ ','')}</div></div>
      <div class="kpi"><div class="label">Mantenimiento</div><div class="value">${fmtMoney(maintTotal).replace('S/ ','')}</div><div class="delta">${((maintTotal/grand)*100).toFixed(0)}% del total</div></div>
      <div class="kpi"><div class="label">Combustible</div><div class="value">${fmtMoney(fuelTotal).replace('S/ ','')}</div><div class="delta">${((fuelTotal/grand)*100).toFixed(0)}% del total</div></div>
      <div class="kpi"><div class="label">Neumáticos</div><div class="value">${fmtMoney(tireTotal).replace('S/ ','')}</div><div class="delta">${((tireTotal/grand)*100).toFixed(0)}% del total</div></div>
      <div class="kpi"><div class="label">Compras a Almacén</div><div class="value">${fmtMoney(almacenTotal).replace('S/ ','')}</div><div class="delta">${((almacenTotal/grand)*100).toFixed(0)}% del total</div></div>
    </div>
    <div class="card"><div class="card-head"><h3>Top 10 vehículos por costo acumulado</h3><div class="hint">Mantenimiento + combustible + neumáticos</div></div>
      ${topVehicles.map(([plate,cost])=>`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;"><span class="mono">${plate}</span><span>${fmtMoney(cost)}</span></div><div class="progress-track"><div class="progress-fill" style="width:${(cost/maxCost)*100}%;background:var(--accent);"></div></div></div>`).join('') || `<div class="empty">Sin datos de costos aún</div>`}
    </div>`;
}

function reportRows(){
  const plateOk = (p)=> !filters.reportPlate || p===filters.reportPlate;
  if(filters.reportTab==='costos'){
    const byV = {};
    const maintenanceByCC = computeMaintenanceCostByCC(filters.reportFrom, filters.reportTo);
    const vehiclePlates = new Set(state.vehicles.map(v=>v.plate));
    Object.entries(maintenanceByCC).forEach(([cc, amount])=>{
      if(!vehiclePlates.has(cc) || !plateOk(cc)) return;
      byV[cc] = byV[cc]||{plate:cc,mant:0,fuel:0,tire:0};
      byV[cc].mant += amount;
    });
    state.fuelLogs.filter(f=>plateOk(f.plate)&&inRange(f.date)).forEach(f=>{ byV[f.plate]=byV[f.plate]||{plate:f.plate,mant:0,fuel:0,tire:0}; byV[f.plate].fuel+=Number(f.cost); });
    tireSpendEvents().filter(e=>e.plate&&plateOk(e.plate)&&inRange(e.date)).forEach(e=>{ byV[e.plate]=byV[e.plate]||{plate:e.plate,mant:0,fuel:0,tire:0}; byV[e.plate].tire+=e.cost; });
    return Object.values(byV).map(r=>({Placa:r.plate,'Mantenimiento (S/)':r.mant.toFixed(2),'Combustible (S/)':r.fuel.toFixed(2),'Neumáticos (S/)':r.tire.toFixed(2),'Total (S/)':(r.mant+r.fuel+r.tire).toFixed(2)})).sort((a,b)=>Number(b['Total (S/)'])-Number(a['Total (S/)']));
  }
  if(filters.reportTab==='mantenimiento'){
    return state.maintenance.filter(m=>plateOk(m.plate)&&inRange(m.date)).map(m=>({Placa:m.plate,Tipo:m.kind,Descripción:m.description,Fecha:fmtDate(m.date),'Costo (S/)':Number(m.cost).toFixed(2),Estado:m.status}));
  }
  if(filters.reportTab==='centrocosto'){
    const ccOk = (c)=> !filters.reportPlate || (c||'').toUpperCase().includes(filters.reportPlate.trim().toUpperCase());
    const maintenanceByCC = computeMaintenanceCostByCC(filters.reportFrom, filters.reportTo);
    const byCC = {};
    const bump = (cc, field, amount)=>{ if(!cc) return; byCC[cc] = byCC[cc]||{cc, mant:0, tire:0}; byCC[cc][field]+=amount; };
    Object.entries(maintenanceByCC).forEach(([cc, amount])=>{ if(ccOk(cc)) bump(cc, 'mant', amount); });
    tireSpendEvents().filter(e=>e.plate && ccOk(e.plate) && inRange(e.date)).forEach(e=>{ bump(e.plate, 'tire', e.cost); });
    return Object.values(byCC).map(r=>({'Centro de Costo':r.cc,'Total (S/)':(r.mant+r.tire).toFixed(2)})).sort((a,b)=>Number(b['Total (S/)'])-Number(a['Total (S/)']));
  }
  // combustible
  if(filters.reportFuelProviders===null) filters.reportFuelProviders = new Set();
  const providerOk = (s)=> filters.reportFuelProviders.size===0 || (s && filters.reportFuelProviders.has(s));
  return state.fuelLogs.filter(f=>plateOk(f.plate)&&inRange(f.date)&&providerOk(f.supplier)).map(f=>({
    'Placa / Destino': f.plate || (f.destination? `Sin placa — ${f.destination}` : 'Sin placa'),
    Fecha: fmtDate(f.date), Hora: f.time||'', Ciudad: f.city||'', Proveedor: f.supplier||'',
    'N° Vale': f.voucherNumber||'', Galones: Number(f.gallons||0).toFixed(2), PPG: Number(f.ppg||0).toFixed(3),
    'Costo (S/)': Number(f.cost||0).toFixed(2)
  }));
}

  document.getElementById('report-print-area').innerHTML = `
    ${summary}
    <div class="card">
      <div class="table-scroll"><table><thead><tr>${cols.map(c=>{
        const active = sortState && sortState.key===c;
        const arrow = active? (sortState.dir==='asc'? ' ▲':' ▼') : '';
        return `<th class="sortable-th" data-report-sort-key="${c}">${c}${arrow}</th>`;
      }).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="mono">${r[c]}</td>`).join('')}</tr>`).join('') || `<tr><td><div class="empty">Sin resultados para los filtros seleccionados</div></td></tr>`}</tbody>${footer}</table></div>
    </div>`;
  document.querySelectorAll('[data-report-sort-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.reportSortKey;
      const current = filters.reportSort[filters.reportTab];

// Comparativo mensual: arma la lista de meses "YYYY-MM" entre dos meses
// (inclusive), para que el reporte pueda mostrar 2 meses (comparación
// simple) o una racha larga (tendencia), con el mismo selector.
function monthsInRange(fromYM, toYM){
  if(!fromYM || !toYM) return [];
  const [fy,fm] = fromYM.split('-').map(Number);
  const [ty,tm] = toYM.split('-').map(Number);
  const startIdx = fy*12+fm, endIdx = ty*12+tm;
  if(isNaN(startIdx) || isNaN(endIdx) || startIdx>endIdx) return [];
  const months = [];
  for(let idx=startIdx; idx<=endIdx; idx++){
    const yy = Math.floor((idx-1)/12), mm = ((idx-1)%12)+1;
    months.push(`${yy}-${String(mm).padStart(2,'0')}`);
  }
  return months;
}
function monthLabelEs(ym){
  const [y,m] = ym.split('-').map(Number);
  const names = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${names[m-1]} ${y}`;
}
const FUEL_COMPARE_METRICS = [
  {key:'gasto', label:'Gasto (S/)'}, {key:'galones', label:'Galones'}, {key:'km', label:'Km Recorridos'},
  {key:'kpg', label:'KPG'}, {key:'gastoKm', label:'Gasto por Km (S//km)'}
];
// KPG = promedio simple de los kpg por tanqueo full (mismo criterio que
// "Kilómetro por galón" arriba, para que ambos reportes concuerden). Un mes
// sin ningún registro de esa placa queda en null ("—"), no en 0 — evita una
// variación falsa cuando en realidad no hay dato ese mes.
function fuelCompareAggregate(rows){
  if(rows.length===0) return {gasto:null, galones:null, km:null, kpg:null, gastoKm:null};
  const gasto = rows.reduce((a,f)=>a+Number(f.cost||0),0);
  const galones = rows.reduce((a,f)=>a+Number(f.gallons||0),0);
  const km = rows.reduce((a,f)=> a + (f.kmReco!=null? Number(f.kmReco):0), 0);
  const kpgVals = rows.filter(f=>f.kpg!=null && !isNaN(Number(f.kpg))).map(f=>Number(f.kpg));
  const kpg = kpgVals.length? kpgVals.reduce((a,b)=>a+b,0)/kpgVals.length : null;
  const gastoKm = km>0? gasto/km : null;
  return {gasto, galones, km, kpg, gastoKm};
}
function fuelCompareFmt(key, v){
  if(v==null) return '—';
  if(key==='gasto') return 'S/ '+v.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(key==='galones') return v.toLocaleString('es-PE',{maximumFractionDigits:2});
  if(key==='km') return v.toLocaleString('es-PE');
  if(key==='kpg') return v.toLocaleString('es-PE',{maximumFractionDigits:2});
  if(key==='gastoKm') return 'S/ '+v.toLocaleString('es-PE',{minimumFractionDigits:3,maximumFractionDigits:3});
  return String(v);
}

    if(!filters.reportFuelCompareFrom) filters.reportFuelCompareFrom = prev;

  const plateRows = platesInRange.map(plate=>({
    plate,

  }));

  document.getElementById('rep-fuel-subview').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>Comparativo mensual</h3><div class="hint">Elige 2 meses para comparar, o un rango más largo para ver la tendencia — gasto, galones, km recorridos y KPG por unidad</div></div>
      <div class="form-row three">
        <div><label>Desde (mes)</label><input id="rep-fuel-compare-from" type="month" value="${filters.reportFuelCompareFrom}"></div>
        <div><label>Hasta (mes)</label><input id="rep-fuel-compare-to" type="month" value="${filters.reportFuelCompareTo}"></div>
      </div>
      <label>Tipo de unidad</label>
      <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;">
        ${allTypes.map(t=>`
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:normal;color:var(--ink);">
            <input type="checkbox" class="rep-fuel-compare-type-chk" value="${t}" ${filters.reportFuelCompareTypes.has(t)?'checked':''}> ${t}
          </label>
        `).join('') || '<div class="empty">No hay tipos de unidad registrados.</div>'}
      </div>
      ${months.length===0? '<div class="empty">El mes "Desde" debe ser igual o anterior al mes "Hasta".</div>' : `
      <div class="table-scroll"><table>
        <thead><tr><th>Métrica (flota completa)</th>${months.map(ym=>`<th style="text-align:right;">${monthLabelEs(ym)}</th>`).join('')}</tr></thead>
        <tbody>${FUEL_COMPARE_METRICS.map(m=>`<tr><td>${m.label}</td>${fleetByMonth.map(agg=>`<td class="mono" style="text-align:right;">${fuelCompareFmt(m.key, agg[m.key])}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
      `}
    </div>
    ${months.length? `
    <div class="card">
      <div class="card-head">
        <h3>Por unidad</h3>
        <div class="pill-nav no-print" style="margin:0;">${FUEL_COMPARE_METRICS.map(m=>`<button class="pill ${metric===m.key?'active':''}" data-repfuel-compare-metric="${m.key}">${m.label}</button>`).join('')}</div>
      </div>
      <div class="table-scroll"><table>
        <thead><tr><th>Placa</th>${months.map(ym=>`<th style="text-align:right;">${monthLabelEs(ym)}</th>`).join('')}</tr></thead>
        <tbody>${plateRows.map(r=>`<tr><td class="mono">${r.plate}</td>${r.byMonth.map(v=>`<td class="mono" style="text-align:right;">${fuelCompareFmt(metric, v)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${months.length+1}"><div class="empty">Sin datos de combustible en este rango.</div></td></tr>`}</tbody>
      </table></div>
    </div>

  wireFilterBar([

  ], renderFuelComparativoReportBody);
  document.querySelectorAll('[data-repfuel-compare-metric]').forEach(b=> b.addEventListener('click', ()=>{ filters.reportFuelCompareMetric=b.dataset.repfuelCompareMetric; renderFuelComparativoReportBody(); }));
  document.querySelectorAll('.rep-fuel-compare-type-chk').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      if(chk.checked) filters.reportFuelCompareTypes.add(chk.value); else filters.reportFuelCompareTypes.delete(chk.value);
      renderFuelComparativoReportBody();
    });
  });
}
function renderFuelKpgReportBody(){
  if(filters.reportFuelKpgTypes===null) filters.reportFuelKpgTypes = new Set();
  const allTypes = getCycleUnitTypes();
  const plateOk = (p)=> !filters.reportPlate || p===filters.reportPlate;
  const baseRows = state.fuelLogs.filter(f=> f.plate && plateOk(f.plate) && inRange(f.date) && f.kpg!=null && !isNaN(Number(f.kpg)));

  const typeOk = (plate)=>{
    if(filters.reportFuelKpgTypes.size===0) return true;
    const v = findVehicle(plate);
    return v && filters.reportFuelKpgTypes.has(v.type);
  };
  const rows = baseRows.filter(f=>typeOk(f.plate));
