// Costo y Galones son el mismo reporte (agrupar por tipo de vehículo,
// torta + tablas anidadas) sobre dos campos distintos — unificado acá
// en un solo cuerpo parametrizable; cada wrapper solo aporta el campo
// a sumar, los textos y el formato de número/unidad.
function renderFuelGroupedPieReport(cfg){
  const plateOk = (p)=> !filters.reportPlate || p===filters.reportPlate;
  const rows = state.fuelLogs.filter(f=> f.plate && plateOk(f.plate) && inRange(f.date));
  const byPlate = {};
  rows.forEach(f=>{ byPlate[f.plate] = (byPlate[f.plate]||0) + Number(f[cfg.field]||0); });
  const byType = {};
  Object.entries(byPlate).forEach(([plate,val])=>{
    const v = findVehicle(plate);
    const type = (v && v.type) || 'Sin tipo';
    (byType[type] = byType[type]||[]).push({plate, val});
  });
  const groups = Object.entries(byType)
    .map(([type,list])=>({type, list: list.sort((a,b)=>b.val-a.val), total: list.reduce((a,x)=>a+x.val,0)}))
    .sort((a,b)=>b.total-a.total);
  const grandTotal = groups.reduce((a,g)=>a+g.total,0);
  const fmt = (n)=> n.toLocaleString('es-PE', cfg.fmtOptions);
  const containerId = `rep-fuel-${cfg.idSuffix}-pie-container`;
  const canvasId = `rep-fuel-${cfg.idSuffix}-pie`;

  document.getElementById('rep-fuel-subview').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>${cfg.heading} por tipo</h3></div>
      <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;">
        <div id="${containerId}" style="flex:1 1 320px;min-width:280px;"></div>
        <div style="flex:1 1 280px;min-width:240px;">
          <table><thead><tr><th>Tipo</th><th>${cfg.colHeader}</th><th>%</th></tr></thead>
          <tbody>${groups.map(g=>`<tr><td>${g.type}</td><td class="mono">${fmt(g.total)}</td><td class="mono">${grandTotal>0?(g.total/grandTotal*100).toFixed(1):'0.0'}%</td></tr>`).join('') || `<tr><td colspan="3"><div class="empty">Sin datos</div></td></tr>`}</tbody>
          ${groups.length>1? `<tfoot><tr style="font-weight:600;"><td>Total</td><td class="mono">${fmt(grandTotal)}</td><td class="mono">100.0%</td></tr></tfoot>` : ''}
          </table>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>${cfg.heading} por placa</h3><div class="hint">Agrupado por tipo de unidad, de mayor a menor ${cfg.byPlateHint}</div></div>
      ${groups.map(g=>`
        <div style="margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
            <h4 style="margin:0;">${g.type}</h4>
            <span style="font-size:12.5px;color:var(--ink-soft);">${cfg.asideFmt(g.total)} · ${grandTotal>0?(g.total/grandTotal*100).toFixed(1):'0.0'}%</span>
          </div>
          <div class="table-scroll"><table><thead><tr><th>Placa</th><th>${cfg.colHeader}</th><th>% del tipo</th></tr></thead>
          <tbody>${g.list.map(x=>`<tr><td class="mono">${x.plate}</td><td class="mono">${fmt(x.val)}</td><td class="mono">${g.total>0?(x.val/g.total*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</tbody></table></div>
        </div>
      `).join('') || `<div class="empty">Sin datos de combustible para los filtros seleccionados.</div>`}
    </div>
  `;

  const pieContainer = document.getElementById(containerId);
  if(groups.length===0){
    pieContainer.innerHTML = '<div class="empty">Sin datos de combustible para los filtros seleccionados.</div>';
    return null;
  }
  if(typeof Chart === 'undefined'){
    pieContainer.innerHTML = `<div class="empty">No se pudo cargar la librería de gráficos (Chart.js). Verifica tu conexión a internet y refresca la página.</div>`;
    return null;
  }
  const colors = ['#2F6FED','#2E9E6C','#C9861E','#D5473C','#8A5CF6','#0EA5B7','#DB2777','#64748B'];
  pieContainer.innerHTML = `<div style="position:relative;height:320px;"><canvas id="${canvasId}"></canvas></div>`;
  return new Chart(document.getElementById(canvasId), {
    type:'pie',
    data:{
      labels: groups.map(g=>g.type),
      datasets:[{ data: groups.map(g=>Number(g.total.toFixed(2))), backgroundColor: groups.map((g,i)=>colors[i%colors.length]) }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{position:'bottom'},
        tooltip:{ callbacks:{ label:(ctx)=>{
          const pct = grandTotal>0? (ctx.parsed/grandTotal*100).toFixed(1) : '0.0';
          return `${ctx.label}: ${cfg.tooltipFmt(ctx.parsed)} (${pct}%)`;
        }}}
      }
    }
  });
}

async function createUserViaFunction(email, password, fullName, role){
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/create-user`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${state.session.access_token}` },
    body: JSON.stringify({ email, password, fullName, role })
  });
  const result = await resp.json().catch(()=>({error:'Respuesta inválida del servidor'}));
  if(!resp.ok || result.error){ alert('No se pudo crear el usuario: '+(result.error||resp.statusText)+'\n\n¿Ya publicaste la función "create-user"? Revisa SETUP.md.'); return null; }
  return result;
}
function permissionsFormHtml(perms){
  perms = perms || {};
  return PERMISSION_TREE.map(mod=>{

    let subsHtml = '';
    if(mod.subs){
      subsHtml = `<div style="margin-left:24px;margin-top:2px;">${mod.subs.map(sub=>{
        const subNode = (modNode.subs && modNode.subs[sub.id]) || {};
        let nestedHtml = '';
        if(sub.subs){
          nestedHtml = `<div style="margin-left:24px;margin-top:2px;">${sub.subs.map(nested=>{
            const nestedNode = (subNode.subs && subNode.subs[nested.id]) || {};
            return `<label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:normal;margin-bottom:3px;">
              <input type="checkbox" class="perm-check" data-path="${mod.id}.${sub.id}.${nested.id}" ${nestedNode.checked?'checked':''}> ${nested.label}
            </label>`;
          }).join('')}</div>`;
        }
        return `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:normal;margin-bottom:3px;">
          <input type="checkbox" class="perm-check" data-path="${mod.id}.${sub.id}" ${subNode.checked?'checked':''}> ${sub.label}
        </label>${nestedHtml}`;
      }).join('')}</div>`;
    }
    return `<label style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin-bottom:2px;">
      <input type="checkbox" class="perm-check" data-path="${mod.id}" ${modNode.checked?'checked':''}> ${mod.label}
    </label>${subsHtml}`;
  }).join('');
}
function readPermissionsFromForm(){
  const result = {};
  document.querySelectorAll('.perm-check').forEach(chk=>{
    const path = chk.dataset.path.split('.');
    let node = result;
    path.forEach((key,i)=>{
      if(!node[key]) node[key] = {checked:false};
      if(i===path.length-1) node[key].checked = chk.checked;
      else { if(!node[key].subs) node[key].subs = {}; node = node[key].subs; }
    });
  });
  return result;
}
function wirePermissionsTree(){
  // marcar un sub-check también marca su(s) checkbox(es) padre, para no
  // tener que hacer doble clic (módulo + submenú) cada vez
  document.querySelectorAll('.perm-check').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      if(!chk.checked) return;
      const parts = chk.dataset.path.split('.');
      for(let i=parts.length-1;i>0;i--){
        const parentPath = parts.slice(0,i).join('.');
        const parentChk = document.querySelector(`.perm-check[data-path="${parentPath}"]`);
        if(parentChk) parentChk.checked = true;
      }
    });
  });
  const customToggle = document.getElementById('user-custom-access');
  const treeWrap = document.getElementById('user-perm-tree');
  if(customToggle && treeWrap){
    const update = ()=>{ treeWrap.style.display = customToggle.checked? 'block' : 'none'; };
    customToggle.addEventListener('change', update);
    update();
  }
}

      <td><button class="btn btn-sm" data-edit-user="${p.id}">Editar permisos</button></td></tr>`).join('') || `<tr><td colspan="7"><div class="empty">Sin usuarios cargados</div></td></tr>`}</tbody></table></div>
    </div>`;
  document.querySelectorAll('[data-role-user]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const {error} = await sb.from('profiles').update({role: sel.value}).eq('id', sel.dataset.roleUser);
      if(error){ alert('No se pudo actualizar el rol: '+error.message); return; }
      const p = state.profiles.find(x=>x.id===sel.dataset.roleUser); if(p) p.role = sel.value;
      if(sel.dataset.roleUser === state.session.user.id){ state.profile.role = sel.value; renderApp(); }
    });
  });
  document.querySelectorAll('[data-edit-user]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = state.profiles.find(x=>x.id===btn.dataset.editUser);
      if(!p) return;
      openModal(`Editar permisos — ${p.fullName||p.id}`, userEditFormBody(p), async (d)=>{
        const areas = [...document.querySelectorAll('.user-area-check:checked')].map(c=>c.value);
        const lugares = [...document.querySelectorAll('.user-lugar-check:checked')].map(c=>c.value);
        const customAccess = document.getElementById('user-custom-access').checked;
        const allowedModules = customAccess? readPermissionsFromForm() : {};
        const patch = {role: d.role, areas, lugares, customAccess, allowedModules};
        const {data, error} = await sb.from('profiles').update(toSnake(patch)).eq('id', p.id).select().single();
        if(error){ alert('No se pudo actualizar: '+error.message); return; }
        Object.assign(p, toCamel(data));
        if(p.id === state.session.user.id){
          Object.assign(state.profile, toCamel(data));
          const newLugares = assignedLugares();
          if(!newLugares.includes(state.currentLugar)) state.currentLugar = newLugares.length===1? newLugares[0] : null;
          renderApp();
          return;
        }
        closeModal(); renderView();
      }, 'Guardar cambios');
      wirePermissionsTree();
      const roleSel = document.getElementById('user-edit-role');
      const conductorHint = document.getElementById('user-edit-conductor-hint');
      if(roleSel && conductorHint){
        roleSel.addEventListener('change', ()=>{ conductorHint.style.display = roleSel.value==='conductor'? '' : 'none'; });
      }
    });
  });
}

/* ===================== DEMO DATA SEEDING (admin only, one-time) ===================== */
async function seedDemoData(){
  const TIPOS=['Bus','Minibus','Camión Furgón','Tracto','Camioneta','Montacarga','Trimoto'];
  const MARCAS=['Scania','Volvo','Mercedes Benz','Freightliner','Man','Hyundai','Kia','Toyota','Clark','Great Wall'];
  const MODELOS=['K400','K410','K440','K450','B430R','B450R','O500RSD','LO 916/48','ATEGO 2428','ATEGO 1726','ACCELO 1016','ATEGO 1419','P320','M2','CL120','H-100 TRUCK'];
  const CARROCERIAS=['Marcopolo','Comil','Modasa','Metalval','Bruce','Contibus','Halcón'];
  const FORMULAS=['4x2','4x4','6x2','6x4','8x2','6x2x4'];
  const RUEDAS_OPTS=[6,8,10,12];
  const EJES_OPTS=[2,3,4];
  const SEDES=['Interprovincial','Lima','Cajamarca','Trujillo','Chiclayo','Jaén','Piura'];
  const SERVICIOS=['Oro','Plata','Clásico','No corresponde'];
  const OPERACIONES=['Interprovincial','Personal','Turístico','Carga','Local'];
  const CITIES=['Lima','Arequipa','Trujillo','Chiclayo','Piura','Cajamarca','Jaén','Cusco','Chimbote'];
  const vehiclesToInsert=[];
  for(let i=0;i<40;i++){
    const statusRoll=Math.random();
    const esBus = Math.random()<0.4;
    vehiclesToInsert.push({
      plate: rnd(['ABC','BCD','CDE','DEF','EFG','FGH'])+'-'+pad(rndInt(100,999),3),
      internal_number: String(rndInt(1000,2999)),
      brand:rnd(MARCAS), model:rnd(MODELOS), type: esBus? rnd(['Bus','Minibus']) : rnd(TIPOS), year:rndInt(2014,2024),
      status: statusRoll<0.72?'Operativo':(statusRoll<0.9?'En Mantenimiento':'Fuera de Servicio'),
      km: rndInt(20000,420000),
      body_type: esBus? rnd(CARROCERIAS) : null,
      passengers: esBus? rnd([43,54,60]) : null,
      distribution: esBus? rnd(['48/12','54','31/12']) : null,
      serial_number: 'S'+rndInt(100000,999999),
      engine_number: 'M'+rndInt(100000,999999),
      wheel_formula: rnd(FORMULAS),
      wheels: rnd(RUEDAS_OPTS),
      axles: rnd(EJES_OPTS),
      net_weight: rndInt(4000,12000),
      gross_weight: rndInt(12000,32000),
      payload: rndInt(5000,18000),
      length: (rndInt(600,1350)/100).toFixed(2),
      width: (rndInt(220,260)/100).toFixed(2),
      height: (rndInt(280,390)/100).toFixed(2),
      service: esBus? rnd(SERVICIOS) : 'No corresponde',
      operation: esBus? rnd(OPERACIONES) : rnd(['Carga','Local','Personal']),
      soat_expiry: addDays(new Date(), rndInt(-25,140)).toISOString().slice(0,10),
      revision_expiry: addDays(new Date(), rndInt(-15,160)).toISOString().slice(0,10),
      circulation_card_expiry: addDays(new Date(), rndInt(-10,300)).toISOString().slice(0,10),
      base: rnd(SEDES)
    });
  }
  const {data: vehicles} = await sb.from('vehicles').insert(vehiclesToInsert).select();
  const NAMES=['Carlos Ramírez','Luis Torres','Jorge Quispe','Miguel Flores','José Huamán','Pedro Vargas','Juan Mendoza','Raúl Chávez','Víctor Rojas','Manuel Castro'];
  const driversToInsert = NAMES.map((n,i)=>({ name:n, license:'Q'+rndInt(10000000,99999999), license_expiry:addDays(new Date(),rndInt(-20,400)).toISOString().slice(0,10), status: rnd(['Activo','Activo','Descanso']), vehicle_plate: vehicles[i]? vehicles[i].plate : null, phone:'9'+rndInt(10000000,99999999) }));
  const {data: drivers} = await sb.from('drivers').insert(driversToInsert).select();
  for(let i=0;i<drivers.length;i++){ if(drivers[i].vehicle_plate){ await sb.from('vehicles').update({driver_id:drivers[i].id}).eq('plate', drivers[i].vehicle_plate); } }

  const maintDesc = {'Preventivo':['Cambio de aceite y filtros','Revisión de frenos','Alineamiento y balanceo'],'Correctivo':['Reparación eléctrica','Cambio de embrague','Reparación de motor']};
  const maintToInsert=[];
  for(let i=0;i<70;i++){ const v=rnd(vehicles); const kind=rnd(['Preventivo','Correctivo']); const off=rndInt(-60,45);
    maintToInsert.push({ plate:v.plate, kind, description:rnd(maintDesc[kind]), date:addDays(new Date(),off).toISOString().slice(0,10), cost:rndInt(150,3200), status: off<-2?'Completado':(off<0?'Vencido':'Programado'), next_due_km: v.km+rndInt(5000,15000) }); }
  await sb.from('maintenance').insert(maintToInsert);

  const FUEL_CITIES=['Lima','Trujillo','Cajamarca','Jaén','Chiclayo','Piura'];
  const FUEL_SUPPLIERS=['Primax','Repsol','Petroperú','Pecsa','Grifo Independiente'];
  const fuelToInsert=[];
  vehicles.forEach(v=>{
    let km = Math.max(0, v.km - rndInt(3000,9000));
    const fillCount = rndInt(2,4);
    const dayOffsets = Array.from({length:fillCount}, ()=> -rndInt(0,60)).sort((a,b)=>a-b);
    dayOffsets.forEach(off=>{
      km += rndInt(400,2500);
      if(km > v.km) km = v.km;
      const isFull = Math.random()<0.85;
      const gallons = Number((rndInt(2500,8000)/100).toFixed(2));
      const ppg = Number((rndInt(1450,1650)/100).toFixed(3));
      const pilot = rnd(drivers);
      const others = drivers.filter(d=>d.id!==pilot.id);
      const copilot = (Math.random()<0.4 && others.length)? rnd(others) : null;
      const origin = rnd(FUEL_CITIES);
      const destination = rnd(FUEL_CITIES.filter(c=>c!==origin));
      fuelToInsert.push({
        voucher_number: 'V-'+rndInt(10000,99999),
        date: addDays(new Date(), off).toISOString().slice(0,10),
        time: pad(rndInt(5,22),2)+':'+rnd(['00','15','30','45']),
        plate: v.plate,
        odometer: km,
        route: origin+'-'+destination,
        pilot_id: pilot.id,
        copilot_id: copilot? copilot.id : null,
        gallons, ppg,
        cost: Number((gallons*ppg).toFixed(2)),
        is_full_tank: isFull,
        city: origin,
        supplier: rnd(FUEL_SUPPLIERS)
      });
    });
  });
  await sb.from('fuel_logs').insert(fuelToInsert);

  const tirePos=['Del. Izq.','Del. Der.','Post. Izq. 1','Post. Der. 1','Post. Izq. 2','Post. Der. 2'];
  const tiresToInsert=[];
  vehicles.forEach(v=>{ const n = (v.type==='Camioneta'||v.type==='Bus')?4:6; for(let p=0;p<n;p++){ const km=rndInt(3000,85000);
    tiresToInsert.push({ plate:v.plate, position:tirePos[p], brand:rnd(['Bridgestone','Michelin','Goodyear']), install_date:addDays(new Date(),-rndInt(30,700)).toISOString().slice(0,10), km, estado: km>70000?'Cambiar':(km>45000?'Regular':'Bueno') }); } });
  await sb.from('tires').insert(tiresToInsert);

  // Usa el maestro real de rutas fijas (route_rates, ya cargado por schema.sql)
  // y conductores recién creados — plate/date/route_name/driver_id/co_driver_id
  // es la forma que realmente lee renderRutas(); las columnas viejas
  // origin/destination/distance_km/status ya no las muestra la pantalla.
  const routeNamesPool = state.routeRates.map(r=>r.routeName).filter(Boolean);
  const routesToInsert=[];
  for(let i=0;i<40;i++){
    const v=rnd(vehicles); const off=rndInt(-10,10);
    const drv=rnd(drivers); const others=drivers.filter(d=>d.id!==drv.id);
    const coDrv=(Math.random()<0.4 && others.length)? rnd(others) : null;
    routesToInsert.push({
      plate:v.plate,
      date:addDays(new Date(),off).toISOString().slice(0,10),
      route_name: routeNamesPool.length? rnd(routeNamesPool) : null,
      driver_id: drv.id,
      co_driver_id: coDrv? coDrv.id : null
    });
  }
  await sb.from('routes').insert(routesToInsert);

  const items=['Frenos','Luces y direccionales','Neumáticos y presión','Niveles de aceite y refrigerante','Extintor vigente','Botiquín de primeros auxilios','Cinturones de seguridad','Espejos y limpiaparabrisas','Documentos del vehículo','Carga asegurada'];
  const checkToInsert=[];
  for(let i=0;i<50;i++){ const v=rnd(vehicles); const its=items.map(it=>({item:it, ok:Math.random()>0.08})); const allOk=its.every(x=>x.ok);
    checkToInsert.push({ plate:v.plate, date:addDays(new Date(),-rndInt(0,10)).toISOString().slice(0,10), items:its, status: allOk?'Conforme':'Observado' }); }
  await sb.from('checklists').insert(checkToInsert);

  // Productos es el maestro real que lee renderInventario() (la tabla
  // "inventory" se sigue cargando en la base pero ninguna pantalla la usa).
  const prodItems=[{name:'Filtro de aceite',code:'FA-001',unit:'UNIDAD',cost:35},{name:'Filtro de aire',code:'FA-002',unit:'UNIDAD',cost:48},{name:'Pastillas de freno (juego)',code:'PF-010',unit:'JUEGO',cost:180},{name:'Neumático 295/80R22.5',code:'NEU-01',unit:'UNIDAD',cost:850},{name:'Batería 12V',code:'BAT-12',unit:'UNIDAD',cost:420},{name:'Aceite de motor 15W40',code:'ACE-15',unit:'GALON',cost:62}];
  const {data: productsData} = await sb.from('products').insert(prodItems.map(it=>({...it, stock: rndInt(0,60), min_stock:10}))).select();

  // Cabecera + ítems, en la forma real que usa Orden de Compra
  // (poHeaderPayloadFromForm/poItemPayloadFromForm), no el formato viejo
  // de una sola tabla plana con supplier/item/qty/total.
  const AUTHORIZERS=['GERENCIA','JEFATURA DE FLOTA','JEFATURA DE MANTENIMIENTO'];
  const suppliersToInsert=[{ruc:'20100100100',name:'Repuestos Andina SAC'},{ruc:'20100200200',name:'Distribuidora Norte'},{ruc:'20100300300',name:'Llantas del Perú'}];
  const {data: suppliersData} = await sb.from('suppliers').insert(suppliersToInsert).select();
  let nextPoNumber = computeNextPoNumber();
  for(let i=0;i<25;i++){
    const supplier = rnd(suppliersData);
    const orderDate = addDays(new Date(), -rndInt(0,45)).toISOString().slice(0,10);
    const paymentMethod = rnd(['Contado','Crédito']);
    const {data: po} = await sb.from('purchase_orders').insert({
      po_number: nextPoNumber++, supplier_ruc: supplier.ruc, supplier_name: supplier.name,
      voucher_type: rnd(['FACTURA','BOLETA']), payment_method: paymentMethod,
      credit_days: paymentMethod==='Crédito'? rnd([15,30,45,60]) : null, currency:'Soles',
      authorizer: rnd(AUTHORIZERS), order_date: orderDate,
      delivery_date: addDays(new Date(orderDate), rndInt(3,15)).toISOString().slice(0,10),
      ship_to: rnd(SEDES), includes_igv:true
    }).select().single();
    if(!po) continue;
    const nItems = rndInt(1,4);
    const poItems=[];
    for(let j=0;j<nItems;j++){
      const prod = rnd(productsData);
      const qty = rndInt(2,20);
      poItems.push({ purchase_order_id:po.id, code:prod.code, oem_code:null, product_name:prod.name, unit:prod.unit, cost_center:rnd(vehicles).plate, quantity:qty, unit_cost:prod.cost, subtotal:Number((qty*prod.cost).toFixed(2)), sort_order:j });
    }
    await sb.from('purchase_order_items').insert(poItems);
  }

  await loadAllData();
  renderView();
}

initAuth();
